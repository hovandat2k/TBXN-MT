<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe8f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TB Xanh – Nổi</title>
<meta property="og:title" content="TB Xanh – Nổi">
<meta property="og:type" content="website">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{
  --bg:#f3f9fd; --surface:#ffffff; --ink:#1f3a4d; --muted:#6a8799; --line:#d8e9f4;
  --brand:#4ea8de; --brand-2:#8cc8ee; --accent:#5bb2e6; --btn:#cfe8f8; --btn-ink:#1b5f8c; --ok:#2c7a5a; --warn:#c0492f; --amber:#d99a1c;
  --field:#fff; --soft:#eef6fc; --shadow:0 6px 20px rgba(60,140,200,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1820; --surface:#15232e; --ink:#e2f0f9; --muted:#8fb0c4; --line:#24394a;
    --brand:#7cc3ef; --brand-2:#4f9fcf; --accent:#7cc3ef; --btn:#7cc3ef; --btn-ink:#0e1820; --field:#112029; --soft:#182a37; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1820; --surface:#15232e; --ink:#e2f0f9; --muted:#8fb0c4; --line:#24394a;
  --brand:#7cc3ef; --brand-2:#4f9fcf; --accent:#7cc3ef; --btn:#7cc3ef; --btn-ink:#0e1820; --field:#112029; --soft:#182a37; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.wrap{max-width:860px;margin:0 auto}
header{padding:calc(18px + env(safe-area-inset-top)) 0 12px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;box-shadow:var(--shadow);flex:none;display:block}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.sub{margin:0;color:var(--muted);font-size:12.5px}
.hbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);width:44px;height:44px;min-height:0;padding:0;border-radius:14px;font-size:18px;flex:none;position:relative}
#setBtn[data-ai]::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface)}
#setBtn[data-ai="ok"]::after{background:#2fa36b}
#setBtn[data-ai="err"]::after{background:var(--warn)}
#setBtn[data-ai="unk"]::after{background:var(--amber)}
.gstat{margin-top:12px;padding:9px 12px;border-radius:12px;font-size:13.5px;font-weight:600;background:var(--soft);color:var(--muted);display:flex;align-items:center;gap:8px}
.gstat.ok{background:color-mix(in srgb,#2fa36b 14%,transparent);color:#1f7a4f}
.gstat.err{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn)}
.gstat.wait{color:var(--brand)}
.dlg .row2 .test{margin-right:auto}
.hbtn:first-of-type{margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 .tag{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
button{font:inherit;font-weight:700;font-size:14.5px;border:0;border-radius:13px;padding:10px 14px;cursor:pointer;transition:transform .08s, opacity .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;color:var(--ink);background:transparent}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:default}
.primary{background:var(--btn);color:var(--btn-ink)}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
:root[data-theme="dark"] .primary{color:#0e1820}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary{color:#0e1820}}

/* ===== Paste zone ===== */
#drop{border:2px dashed color-mix(in srgb,var(--brand) 55%,transparent);border-radius:16px;padding:20px 14px;text-align:center;
  background:color-mix(in srgb,var(--brand) 6%,transparent);cursor:pointer;transition:background .15s,border-color .15s;outline:none}
#drop:focus-visible,#drop.over{background:color-mix(in srgb,var(--brand) 14%,transparent);border-color:var(--brand)}
#drop .big{font-size:30px;line-height:1}
#drop .t{font-weight:800;font-size:16px;margin-top:6px}
#drop .t kbd{font:inherit;font-size:13px;background:var(--surface);border:1px solid var(--line);border-bottom-width:2.5px;border-radius:7px;padding:1px 7px;margin:0 2px}
#drop .s{color:var(--muted);font-size:13px;margin-top:2px}
.pbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pbtns button{flex:1 1 0}
.opt{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;color:var(--ink);user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;margin:0;transition:.15s;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked{background:var(--brand)}
.switch input:checked::after{left:19px}
.aitag{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--muted)}
.aitag.on{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
#prog{margin-top:12px;display:none}
.progrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.progrow #progTxt{margin-top:0;flex:1}
#cancelBtn[hidden]{display:none}
#cancelBtn{min-height:30px;padding:4px 10px;font-size:12.5px;flex:none}
#prog.show{display:block}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand-2),var(--brand));border-radius:999px;transition:width .25s}
#progTxt{font-size:13px;color:var(--muted);margin-top:6px;font-weight:600}
#srcBox{margin-top:12px;display:none}
#srcBox.show{display:block}
#srcBox summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--brand);list-style:none;display:flex;align-items:center;gap:6px}
#srcBox summary::-webkit-details-marker{display:none}
#srcBox summary::before{content:"▸";transition:transform .15s}
#srcBox[open] summary::before{transform:rotate(90deg)}
#srcImg{display:block;width:100%;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:zoom-in}

/* ===== Data table ===== */
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tbar .sp{flex:1}
.seg{display:inline-grid;grid-auto-flow:column;gap:3px;background:var(--soft);border-radius:12px;padding:3px}
.seg button{min-height:32px;padding:4px 11px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.12)}
.small{min-height:34px;padding:6px 11px;font-size:13px;border-radius:10px}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:14px}
.empty b{display:block;font-size:30px;margin-bottom:6px}
.grp{margin-bottom:10px}
.grp:last-child{margin-bottom:0}
.ghead{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--soft);border-radius:12px;font-weight:700;font-size:14px;margin-bottom:6px}
.ghead input{width:130px;font-weight:800}
.ghead .gsum{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600;text-align:right}
.ghead .gsum b{color:var(--ink)}
.rhead,.row{display:grid;grid-template-columns:30px minmax(0,1.15fr) minmax(0,1fr) 108px 66px 66px 66px 34px;gap:6px;align-items:start}
.rhead{font-size:12px;font-weight:700;color:var(--muted);padding:0 2px 4px}
.rhead span:nth-child(n+3){text-align:center}
.row{padding:4px 2px;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.row .n{font-weight:800;color:var(--muted);text-align:center;padding-top:9px;font-size:14px}
.row .del{width:34px;height:38px;min-height:0;padding:0;font-size:16px;color:var(--muted);border-radius:10px}
.row .del:hover{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.fld{width:100%;font:inherit;font-size:15.5px;font-weight:600;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;
  padding:7px 9px;outline:none;transition:border-color .15s, box-shadow .15s;-webkit-appearance:none;appearance:none;min-width:0}
.fld:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld.num{text-align:right;font-variant-numeric:tabular-nums}
.fld.pct{text-align:center;font-variant-numeric:tabular-nums}
.fld.pct.auto::placeholder{color:var(--brand);opacity:.85;font-style:italic;font-weight:700}
.fld.pct.bad{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--field))}
.fld.warn{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 9%,var(--field))}
.fld.okv{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.cl{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:0 0 2px 2px;display:none}
.hw{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11.5px;color:var(--muted);font-weight:600}
.hw img{height:30px;max-width:100%;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.hw .rd{white-space:nowrap}
.meta{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:12px;color:var(--muted);margin-top:4px;text-align:right}
.note.w{color:var(--amber);font-weight:600}
.addrow{margin-top:4px;width:100%;border:1.5px dashed var(--line);color:var(--muted);min-height:0;height:28px;padding:0 10px;font-size:12.5px;border-radius:9px}

/* full-column table */
.full{overflow-x:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.full table{border-collapse:collapse;min-width:1330px;width:100%;font-size:13.5px}
.full th{background:var(--soft);font-weight:700;font-size:12.5px;padding:7px 5px;white-space:nowrap;text-align:center;color:var(--muted)}
.full td{padding:4px;border-top:1px solid var(--line);vertical-align:middle}
.full td.gtd{background:color-mix(in srgb,var(--brand) 8%,transparent);font-weight:800;padding:7px 10px}
.full .fld{font-size:13.5px;padding:5px 6px;border-radius:8px}
.full td.c{text-align:center;color:var(--muted);font-weight:700}

/* ===== Summary ===== */
.stats{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:16px;padding:12px 14px;min-width:0}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:700}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px}
.stat.main{background:linear-gradient(135deg,#d7eefc,#b3dcf5);color:#164a6e}
.stat.main .l,.stat.main .v small{color:#2c6a94}
.formula{font-size:12px;color:var(--muted);margin-top:10px}
#missNote{font-size:12.5px;color:var(--amber);font-weight:600;margin-top:8px}
#missNote:empty{display:none}

/* ===== Export ===== */
#prevWrap[hidden]{display:none}
.sortbar{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.sortbar .sl{font-size:13px;font-weight:700;color:var(--muted)}
.sortbar select.fld{width:auto;min-width:150px;padding:5px 30px 5px 10px;font-size:14px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.sortbar .seg button:disabled{opacity:.45}
.sortbar{align-items:flex-start;justify-content:space-between}
.sortbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0;flex:1}
#sortLevels{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;flex:1 1 220px;font-size:13px}
.schip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:3px 10px;font-weight:700;font-size:12.5px;color:var(--ink)}
.schip b{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--brand);color:#fff;font-size:10.5px}
.sthen{color:var(--muted);font-size:12px}
.shint{color:var(--muted);font-size:12.5px}
#sortClear{min-height:28px;padding:2px 9px;font-size:12px;border-radius:9px}
.pvbox{position:relative;line-height:0}
.hot{position:absolute;inset:0;pointer-events:none}
.hot button{position:absolute;pointer-events:auto;background:transparent;border:0;border-radius:0;min-height:0;padding:0;cursor:pointer;transition:background .12s}
.hot button:hover,.hot button:focus-visible{background:rgba(78,168,222,.16);outline:none}
.hot button.on{background:rgba(78,168,222,.18)}
.hot .ar{position:absolute;left:50%;bottom:0;transform:translate(-50%,45%);display:flex;align-items:center;gap:1px;font:800 clamp(8px,1vw,12px)/1.15 "Be Vietnam Pro",system-ui,sans-serif;
  background:#1b6fa6;color:#fff;border-radius:5px;padding:1px 4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:1}
.hot .ar.idle{background:#e3f1fb;color:#1b6fa6;opacity:0;transition:opacity .12s}
.hot button:hover .ar.idle,.hot button:focus-visible .ar.idle{opacity:1}
.schip,.sthen,#sortClear,.shint{white-space:nowrap}
.shint{white-space:normal}
.ptog{padding:0;min-height:0;gap:10px;background:none}
.ptog .chev{font-size:12.5px;font-weight:700;color:var(--brand);background:var(--soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
#prevWrap{border:1px solid var(--line);border-radius:14px;overflow:auto;background:#fff;max-height:70vh}
#prev{display:block;width:100%;height:auto}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.actions .danger{color:var(--warn)}
#printArea{display:none}
@media print{
  html,body{background:#fff !important;padding:0 !important}
  body > *:not(#printArea){display:none !important}
  #printArea{display:block !important}
  #printArea img{display:block;width:auto;height:auto;max-height:96vh;margin:0 auto;break-inside:avoid;page-break-inside:avoid;break-after:page;page-break-after:always}
  #printArea img:last-child{break-after:auto;page-break-after:auto}
}
.actions button{flex-direction:column;gap:2px;min-height:0;padding:8px 2px;font-size:12px;font-weight:700;border-radius:12px;line-height:1.15}
.actions button .i{font-size:18px;line-height:1}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1d4f70;color:#fff;
  padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* dialogs */
dialog{border:0;border-radius:20px;padding:0;max-width:min(520px,calc(100% - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,30,45,.45)}
.dlg{padding:18px}
.dlg h3{margin:0 0 6px;font-size:17px}
.dlg p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.dlg label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
.dlg .row2{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.dlg a{color:var(--brand)}
#zoomDlg{max-width:min(1100px,calc(100% - 16px))}
#zoomDlg img{display:block;width:100%;height:auto;background:#fff}
#zoomDlg .dlg{padding:8px}

@media (max-width:640px){
  .sortbar{flex-direction:column;align-items:stretch}
  .sortbar #grpSeg{order:-1;align-self:flex-start}
  .sortbox{width:100%;flex-wrap:nowrap;align-items:flex-start}
  .sortbox .sl{padding-top:4px;flex:none}
  body{padding:0 12px calc(28px + env(safe-area-inset-bottom))}
  .card{padding:13px;border-radius:18px}
  h1{font-size:18px}
  .rhead{display:none}
  .row{grid-template-columns:24px minmax(0,1.3fr) repeat(3,minmax(0,1fr)) 30px;grid-template-areas:"n kh kh kh kh d" ". gc gc gc gc ." ". tl x no c .";row-gap:4px;padding:6px 0}
  .row .n{grid-area:n;padding-top:8px}
  .row .ckh{grid-area:kh}.row .cgc{grid-area:gc}.row .ctl{grid-area:tl}.row .cx{grid-area:x}.row .cn{grid-area:no}.row .cc{grid-area:c}.row .del{grid-area:d;width:30px}
  .cl{display:block}
  .stats{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat.main{grid-column:1 / -1}
  .stat{padding:10px 11px}
  .stat .v{font-size:21px}
  .stat.main .v{font-size:24px}
  .stat .v small{font-size:12px;margin-left:2px}
  .ghead{flex-wrap:wrap}
  .ghead .gsum{margin-left:0;width:100%;text-align:left}
  .pbtns button{font-size:13.5px;padding:9px 8px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="icons/icon-192.png" alt="">
    <div>
      <h1>Trung bình Xanh – Nổi</h1>
    </div>
    <button class="hbtn" id="setBtn" aria-label="Cài đặt nhận dạng" title="Cài đặt nhận dạng">⚙️</button>
    <button class="hbtn" id="themeBtn" aria-label="Đổi giao diện sáng/tối" title="Sáng / tối">🌓</button>
  </header>

  <!-- 1. Nhập ảnh -->
  <section class="card">
    <div id="drop" tabindex="0" role="button" aria-label="Dán hoặc chọn ảnh / PDF phiếu cân">
      <div class="big">🖼️</div>
      <div class="t">Nhấn <kbd>Ctrl</kbd>+<kbd>V</kbd> để dán ảnh</div>
    </div>
    <input type="file" id="file" accept="image/*,application/pdf,.pdf" hidden>
    <div class="pbtns">
      <button type="button" class="primary" id="pasteBtn">📋 Dán ảnh</button>
      <button type="button" class="ghost" id="pickBtn">📁 Chọn ảnh/PDF</button>
      <button type="button" class="ghost" id="manualBtn">✏️ Nhập tay</button>
    </div>
    <div class="opt">
      <label class="switch"><input type="checkbox" id="appendChk"> Ghép thêm vào bảng hiện có</label>
    </div>
    <div id="prog"><div class="bar"><i id="progBar"></i></div><div class="progrow"><div id="progTxt"></div><button type="button" class="ghost small" id="cancelBtn" hidden>✕ Huỷ</button></div></div>
    <details id="srcBox"><summary>Xem ảnh gốc</summary><img id="srcImg" alt="Ảnh đã dán"></details>
  </section>

  <!-- 2. Bảng dữ liệu -->
  <section class="card" id="tableCard">
    <div class="tbar">
      <h2 style="margin:0">Bảng dữ liệu</h2>
      <span class="sp"></span>
      <div class="seg" id="viewSeg"><button type="button" data-v="short" class="on">Rút gọn</button><button type="button" data-v="full">Tất cả cột</button></div>
      <button type="button" class="ghost small" id="clearBtn" title="Xoá toàn bộ bảng">🗑️ Xoá</button>
    </div>
    <div id="tbl"></div>
  </section>

  <!-- 3. Kết quả -->
  <section class="card" id="sumCard">

<script>
'use strict';
/* =========================================================================
   Tiện ích
   ========================================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'd').toLowerCase();
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function toast(msg, ms = 2600){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }

// Khối lượng: "41,926" | "41.926" | "41926" -> 41926 ; "12,5" -> 12.5
function parseKg(s){
  s = String(s ?? '').trim().replace(/\s/g, '');
  if (!s) return null;
  if (/^\d{1,3}([.,]\d{3})+$/.test(s)) return +s.replace(/[.,]/g, '');
  s = s.replace(',', '.');
  if (!/^\d*\.?\d+$/.test(s)) return null;
  return +s;
}
// Phần trăm: "17" | "17.5" | "17,5"
function parsePct(s){
  s = String(s ?? '').trim().replace(/\s|%/g, '').replace(',', '.');
  if (!s || !/^\d*\.?\d+$/.test(s)) return null;
  return +s;
}
const fmtKg = n => n == null || isNaN(n) ? '' : (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
const fmtPct = n => n == null || isNaN(n) ? '–' : (Math.round(n * 100) / 100).toFixed(2).replace(/\.?0+$/, '');
const fmtPctIn = n => n == null || isNaN(n) ? '' : String(Math.round(n * 100) / 100);

/* =========================================================================
   Trạng thái
   ========================================================================= */
const FIELDS = ['stt','soxe','hang','khach','ghichu','tl1','tl2','tlh','bi','thuc','gio','xanh','noi','chin'];
const PF = ['xanh','noi','chin'], isPF = f => PF.includes(f);
const PF_LABEL = { xanh: 'Xanh', noi: 'Nổi', chin: 'Chín' };
// Xanh + Nổi + Chín = 100%: nhập 2 trong 3, phần còn lại tự tính
function pcts(r){
  const v = PF.map(f => parsePct(r[f]));
  const have = v.filter(x => x != null).length;
  let auto = null;
  if (have === 2){ const i = v.findIndex(x => x == null); v[i] = Math.round((100 - v.reduce((a, b) => a + (b || 0), 0)) * 100) / 100; auto = PF[i]; }
  const bad = have >= 2 && (Math.abs(v.reduce((a, b) => a + b, 0) - 100) > 0.01 || v.some(x => x < 0));
  return { x: v[0], n: v[1], c: v[2], auto, bad, have, v: { xanh: v[0], noi: v[1], chin: v[2] } };
}
const COLS_FULL = [
  ['stt','STT'],['soxe','Số xe'],['hang','Hàng hóa'],['khach','Khách hàng'],['tl1','TL Lần 1'],['tl2','TL Lần 2'],
  ['tlh','TL Hàng'],['bi','TL Bì'],['thuc','TL Thực'],['gio','Giờ cân'],['xanh','Xanh (%)'],['noi','Nổi (%)'],['chin','Chín (%)']
];
// bảng sửa “Tất cả cột” có thêm Ghi chú (trên phiếu, ghi chú nằm dưới ô Xanh/Nổi/Chín)
const COLS_EDIT = COLS_FULL.flatMap(c => c[0] === 'khach' ? [c, ['ghichu','Ghi chú']] : [c]);
const NUMF = new Set(['tl1','tl2','tlh','bi','thuc']);
let rows = LS.get('tbxn_rows', []);
let view = LS.get('tbxn_view', 'short');
let expMode = LS.get('tbxn_exp', 'full');
let uid = rows.reduce((m, r) => Math.max(m, r.id || 0), 0) + 1;
const crops = {}; // id -> dataURL ảnh chữ viết tay (không lưu)

function newRow(o = {}){
  const r = { id: uid++, date: '', flags: {} };
  FIELDS.forEach(f => r[f] = '');
  return Object.assign(r, o, { id: r.id, flags: Object.assign({}, o.flags || {}) });
}
function save(){ LS.set('tbxn_rows', rows); }

/* =========================================================================
   Tính toán
   ========================================================================= */
function groups(){
  const g = [], idx = new Map();
  rows.forEach(r => {
    const k = r.date || '';
    if (!idx.has(k)){ idx.set(k, g.length); g.push({ date: k, rows: [] }); }
    g[idx.get(k)].rows.push(r);
  });
  return g;
}
function agg(list){
  let tl = 0, miss = 0, bad = 0;
  const w = { x: 0, n: 0, c: 0 }, sw = { x: 0, n: 0, c: 0 };
  list.forEach(r => {
    const t = parseKg(r.thuc); if (t == null) return;
    tl += t;
    const p = pcts(r);
    ['x','n','c'].forEach(k => { if (p[k] != null){ w[k] += t * p[k]; sw[k] += t; } });
    if (p.have < 2) miss++;
    if (p.bad) bad++;
  });
  const avg = k => sw[k] ? w[k] / sw[k] : null;
  return { tl, x: avg('x'), n: avg('n'), c: avg('c'), miss, bad };
}

/* =========================================================================
   Vẽ bảng
   ========================================================================= */
function renderTable(){
  const box = $('#tbl');
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  if (!rows.length){
    box.innerHTML = `<div class="empty"><b>📄</b>Chưa có dữ liệu. Dán ảnh phiếu cân ở trên, hoặc bấm “Nhập tay”.</div>`;
    updateNumbers();
    return;
  }
  const gs = groups();
  if (view === 'full'){
    let h = `<div class="full"><table><thead><tr>${COLS_EDIT.map(c => `<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>`;
    gs.forEach((g, gi) => {
      h += `<tr><td class="gtd" colspan="${COLS_EDIT.length + 1}">Ngày cân : <input class="fld gdate" data-g="${gi}" value="${esc(g.date)}" style="width:130px;display:inline-block;font-weight:800"></td></tr>`;
      g.rows.forEach(r => {
        h += `<tr data-id="${r.id}">` + COLS_EDIT.map(([f]) => {
          const cls = NUMF.has(f) ? 'num' : isPF(f) ? 'pct' : '';
          const w = { stt: 46, soxe: 110, hang: 150, khach: 170, ghichu: 170, gio: 92, xanh: 62, noi: 62, chin: 62 }[f] || 88;
          return `<td><input class="fld ${cls} ${r.flags[f] ? 'warn' : ''}" data-f="${f}" value="${esc(r[f] ?? '')}" style="width:${w}px" ${NUMF.has(f) || isPF(f) ? 'inputmode="decimal"' : ''}></td>`;
        }).join('') + `<td class="c"><button class="del" data-del="${r.id}" title="Xoá dòng" style="width:30px;height:32px;min-height:0;padding:0">✕</button></td></tr>`;
      });
    });
    box.innerHTML = h + `</tbody></table></div><button type="button" class="addrow" data-add="${gs.length - 1}">＋ Thêm dòng</button>`;
  } else {
    box.innerHTML = gs.map((g, gi) => `
      <div class="grp">
        <div class="ghead">📅 Ngày cân <input class="fld gdate" data-g="${gi}" value="${esc(g.date)}" placeholder="dd/mm/yyyy"><span class="gsum" data-gs="${gi}"></span></div>
        <div class="rhead"><span>#</span><span>Khách hàng</span><span>Ghi chú</span><span>TL thực (kg)</span><span>Xanh %</span><span>Nổi %</span><span>Chín %</span><span></span></div>
        ${g.rows.map((r, i) => rowHTML(r, i + 1)).join('')}
        <button type="button" class="addrow" data-add="${gi}">＋ Thêm dòng</button>
      </div>`).join('');
  }
  updateNumbers();
}
function rowHTML(r, n){
  const crop = crops[r.id];
  const hw = crop ? `<div class="hw" title="Chữ viết tay đọc được">✍️ <img src="${crop}" data-zoom="1" alt=""><span class="rd">${esc(r.hwText || '')}</span></div>` : '';
  const meta = [r.soxe, r.gio].filter(Boolean).join(' · ');
  return `<div class="row" data-id="${r.id}">
    <div class="n">${n}</div>
    <div class="ckh"><input class="fld ${r.flags.khach ? 'warn' : ''}" data-f="khach" value="${esc(r.khach)}" placeholder="Khách hàng">
      ${meta ? `<div class="meta">${esc(meta)}</div>` : ''}${hw}</div>
    <div class="cgc"><input class="fld" data-f="ghichu" value="${esc(r.ghichu ?? '')}" placeholder="Ghi chú"></div>
    <div class="ctl"><span class="cl">TL thực (kg)</span><input class="fld num ${r.flags.thuc ? 'warn' : r.flags.thucOk ? 'okv' : ''}" data-f="thuc" value="${esc(r.thuc)}" inputmode="decimal" placeholder="0"
      title="${r.flags.thuc ? 'Không khớp TL Hàng − TL Bì, hãy kiểm tra' : r.flags.thucOk ? 'Đã khớp TL Hàng − TL Bì' : ''}"></div>
    <div class="cx"><span class="cl">Xanh %</span><input class="fld pct ${r.flags.xanh ? 'warn' : ''}" data-f="xanh" value="${esc(r.xanh ?? '')}" inputmode="decimal" placeholder="–"></div>
    <div class="cn"><span class="cl">Nổi %</span><input class="fld pct ${r.flags.noi ? 'warn' : ''}" data-f="noi" value="${esc(r.noi ?? '')}" inputmode="decimal" placeholder="–"></div>
    <div class="cc"><span class="cl">Chín %</span><input class="fld pct ${r.flags.chin ? 'warn' : ''}" data-f="chin" value="${esc(r.chin ?? '')}" inputmode="decimal" placeholder="–"></div>
    <button type="button" class="del" data-del="${r.id}" title="Xoá dòng" aria-label="Xoá dòng">✕</button>
  </div>`;
}

// Ô còn trống được tự tính (= 100 − 2 ô kia): hiện mờ trong ô; tổng ≠ 100 thì viền đỏ
function showAuto(host, r){
  const p = pcts(r);
  PF.forEach(f => {
    const inp = host.querySelector(`input[data-f="${f}"]`); if (!inp) return;
    const isAuto = p.auto === f;
    inp.placeholder = isAuto ? fmtPct(p.v[f]) : '–';
    inp.classList.toggle('auto', isAuto);
    inp.classList.toggle('bad', p.bad);
    inp.title = p.bad ? 'Xanh + Nổi + Chín phải bằng 100%' : isAuto ? `Tự tính = 100 − ${PF.filter(x => x !== f).map(x => PF_LABEL[x]).join(' − ')}` : '';
  });
}
function updateNumbers(){
  const gs = groups();
  gs.forEach((g, gi) => {
    const a = agg(g.rows), el = document.querySelector(`[data-gs="${gi}"]`);
    if (el) el.innerHTML = `<b>${fmtKg(a.tl)}</b> kg · X <b>${fmtPct(a.x)}</b>% · N <b>${fmtPct(a.n)}</b>% · C <b>${fmtPct(a.c)}</b>%`;
  });
  document.querySelectorAll('#tbl [data-id]').forEach(host => { const r = rows.find(x => x.id === +host.dataset.id); if (r) showAuto(host, r); });
  const a = agg(rows);
  $('#sTL').textContent = fmtKg(a.tl) || '0';
  $('#sX').textContent = fmtPct(a.x);
  $('#sN').textContent = fmtPct(a.n);
  $('#sC').textContent = fmtPct(a.c);
  $('#sumTag').textContent = rows.length ? `${rows.length} xe · ${gs.length} ngày` : '';
  $('#missNote').textContent = [
    a.bad ? `⚠️ ${a.bad} dòng có Xanh + Nổi + Chín khác 100% — hãy kiểm tra ô viền đỏ.` : '',
    a.miss ? `⚠️ ${a.miss} dòng chưa đủ 2 trong 3 số xanh/nổi/chín.` : ''
  ].filter(Boolean).join(' ');
  scheduleExport();
}

// Sự kiện bảng (uỷ quyền)
$('#tbl').addEventListener('input', e => {
  const inp = e.target;
  if (inp.classList.contains('gdate')){
    const g = groups()[+inp.dataset.g]; if (!g) return;
    g.rows.forEach(r => r.date = inp.value.trim());
    save(); scheduleExport();
    return;
  }
  const host = inp.closest('[data-id]'); if (!host || !inp.dataset.f) return;
  const r = rows.find(x => x.id === +host.dataset.id); if (!r) return;
  r[inp.dataset.f] = inp.value;
  if (r.flags[inp.dataset.f]){ delete r.flags[inp.dataset.f]; inp.classList.remove('warn'); }
  if (isPF(inp.dataset.f) && pcts(r).have >= 2) PF.forEach(f => {   // đủ 2/3: ô còn lại tự tính, bỏ viền vàng
    if (!String(r[f] ?? '').trim() && r.flags[f]){ delete r.flags[f]; const o = host.querySelector(`input[data-f="${f}"]`); if (o) o.classList.remove('warn'); }
  });
  if (inp.dataset.f === 'thuc'){ delete r.flags.thucOk; inp.classList.remove('okv'); }
  save(); updateNumbers();
});
$('#tbl').addEventListener('change', e => {
  const inp = e.target;
  if (inp.classList.contains('gdate')){ renderTable(); return; } // gộp nhóm nếu trùng ngày
  if (!inp.dataset.f || !NUMF.has(inp.dataset.f)) return;
  const v = parseKg(inp.value); if (v == null) return;
  const host = inp.closest('[data-id]'); const r = rows.find(x => x.id === +host.dataset.id);
  inp.value = r[inp.dataset.f] = fmtKg(v); save();
});
$('#tbl').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('input.fld')) return;
  e.preventDefault();
  const all = [...document.querySelectorAll('#tbl input.fld')];
  const i = all.indexOf(e.target);
  // xuống cùng cột ở dòng kế tiếp
  const f = e.target.dataset.f;
  const next = all.slice(i + 1).find(x => x.dataset.f === f) || all[i + 1];
  if (next){ next.focus(); next.select(); } else e.target.blur();
});
$('#tbl').addEventListener('focusin', e => { if (e.target.matches('input.fld')) setTimeout(() => e.target.select(), 0); });
$('#tbl').addEventListener('click', e => {
  const d = e.target.closest('[data-del]');
  if (d){ rows = rows.filter(r => r.id !== +d.dataset.del); save(); renderTable(); return; }
  const a = e.target.closest('[data-add]');
  if (a){
    const g = groups()[+a.dataset.add];
    const date = g ? g.date : today();
    const last = g ? g.rows[g.rows.length - 1] : null;
    const r = newRow({ date, stt: String((g ? g.rows.length : 0) + 1) });
    const at = last ? rows.indexOf(last) + 1 : rows.length;
    rows.splice(at, 0, r); save(); renderTable();
    const inp = document.querySelector(`[data-id="${r.id}"] input[data-f="khach"]`); if (inp) inp.focus();
    return;
  }
  const z = e.target.closest('[data-zoom]');
  if (z){ $('#zoomImg').src = z.src; $('#zoomDlg').showModal(); }
});
function today(){ const d = new Date(); return [d.getDate(), d.getMonth() + 1].map(x => String(x).padStart(2, '0')).join('/') + '/' + d.getFullYear(); }

document.querySelectorAll('#viewSeg button').forEach(b => b.addEventListener('click', () => { view = b.dataset.v; LS.set('tbxn_view', view); renderTable(); }));
$('#clearBtn').addEventListener('click', () => {
  if (!rows.length) return;
  if (!confirm('Xoá toàn bộ bảng?')) return;
  rows = []; save(); renderTable();
});
$('#manualBtn').addEventListener('click', () => {
  const g = groups(); const date = g.length ? g[g.length - 1].date : today();
  const r = newRow({ date, stt: String((g.length ? g[g.length - 1].rows.length : 0) + 1) });
  rows.push(r); save(); renderTable();
  const inp = document.querySelector(`[data-id="${r.id}"] input[data-f="khach"]`); if (inp){ inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); inp.focus(); }
});

/* =========================================================================
   Ảnh xuất (giống phiếu cân + 2 cột Xanh, Nổi)
   ========================================================================= */
/* Vẽ trực tiếp lên canvas: không cần thư viện, ảnh sắc nét trên mọi máy */
const SERIF = '"Times New Roman", Times, "Liberation Serif", "Tinos", "Noto Serif", serif';
const SANS = '"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
let logoImg = null;
function getLogo(){
  if (logoImg) return logoImg;
  logoImg = new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = 'icons/icon-192.png'; });
  return logoImg;
}
let grpMode = LS.get('tbxn_grp', 'all');   // 'all' = gộp chung các ngày (mặc định), 'day' = tách theo ngày
const isMerged = () => grpMode === 'all';
const multiDay = () => new Set(rows.map(r => r.date || '')).size > 1;
function sheetCols(){
  const c = expMode === 'full' ? COLS_FULL : [['stt','STT'],['khach','Khách hàng'],['thuc','TL Thực'],['xanh','Xanh (%)'],['noi','Nổi (%)'],['chin','Chín (%)']];
  // gộp nhiều ngày: ngày cân ghi ngay dưới giờ cân (cùng ô); phiếu rút gọn không có cột giờ thì thêm cột Ngày cân
  if (!(isMerged() && multiDay()) || c.some(x => x[0] === 'gio')) return c;
  return c.flatMap(x => x[0] === 'stt' ? [x, ['date','Giờ / Ngày cân']] : [x]);
}
function cellText(r, f, i){
  let v = r[f] ?? '';
  if (NUMF.has(f)){ const n = parseKg(v); v = n == null ? String(v) : fmtKg(n); }
  else if (isPF(f)){ const n = pcts(r).v[f]; v = n == null ? '' : fmtPct(n); }
  else if (f === 'stt' && (isMerged() || !String(v).trim())) v = String(i + 1);   // gộp ngày: đánh số liên tục
  v = String(v).trim();
  if (f === 'gio' && isMerged() && multiDay() && r.date) return v ? [v, r.date] : [r.date];
  if (f === 'date'){ const t = String(r.gio ?? '').trim(); return t && v ? [t, v] : [t || v]; }   // phiếu rút gọn: giờ cân trên, ngày cân dưới
  if (f === 'hang'){ const w = v.split(/\s+/); if (w.length > 2) return [w.slice(0, 2).join(' '), w.slice(2).join(' ')]; if (w.length === 2 && v.length > 10) return w; }
  return [v];
}
async function makeCanvas(mono = false){
  const F = c => mono ? '#fff' : c, T = c => mono ? '#000' : c;   // mono: bản in trắng đen
  try { if (document.fonts){ await Promise.race([Promise.all([document.fonts.load('800 22px "Be Vietnam Pro"'), document.fonts.load('600 15px "Be Vietnam Pro"')]), new Promise(r => setTimeout(r, 1500))]); } } catch(e){}
  const logo = await getLogo();
  const cols = sheetCols(), gs = sheetGroups(), A = agg(rows);
  const FS = 23, PADX = 14, LH = 26;
  const S = 2;                                   // độ phân giải x2
  const m = mkCanvas(10, 10).getContext('2d');
  const tw = (t, w = 400, sz = FS) => { m.font = `${w} ${sz}px ${SERIF}`; return m.measureText(t).width; };
  // độ rộng cột
  const isNX = isPF;
  const widths = cols.map(([f, t]) => {
    let w = tw(t, isNX(f) ? 700 : 400);
    rows.forEach((r, i) => cellText(r, f, i).forEach(l => { w = Math.max(w, tw(l)); }));
    if (f === 'thuc') gs.forEach(g => { w = Math.max(w, tw(fmtKg(agg(g.rows).tl), 700)); }), w = Math.max(w, tw(fmtKg(A.tl), 800, FS + 1));
    return Math.ceil(w + PADX * 2 + (f === 'khach' ? 30 : 0));
  });
  const iThuc = cols.findIndex(c => c[0] === 'thuc');
  const hasWrap = cols.some(c => rows.some((r, i) => cellText(r, c[0], i).length > 1));
  const H_HEAD = 58, H_DATE = 50, H_ROW = hasWrap ? 73 : 54, H_TOT = 48, H_GRAND = 56;
  // Ghi chú: ô gộp ngay dưới Xanh/Nổi/Chín của dòng đó
  const iP0 = cols.findIndex(c => isPF(c[0])), iP1 = cols.length - 1 - [...cols].reverse().findIndex(c => isPF(c[0]));
  const NOTE_FS = 22, NOTE_LH = 28, TOP_H = 48;
  const noteW = iP0 < 0 ? 0 : widths.slice(iP0, iP1 + 1).reduce((a, b) => a + b, 0) - PADX * 2;
  const wrapNote = t => {
    m.font = `400 ${NOTE_FS}px ${SERIF}`;
    const out = []; let cur = '';
    String(t).split(/\s+/).filter(Boolean).forEach(wd => {
      const tt = cur ? cur + ' ' + wd : wd;
      if (m.measureText(tt).width <= noteW || !cur) cur = tt; else { out.push(cur); cur = wd; }
    });
    if (cur) out.push(cur);
    if (out.length > 3){ out.length = 3; out[2] = out[2].replace(/\s*\S*$/, '') + '…'; }
    return out;
  };
  // ô ghi chú cao bằng ô Xanh/Nổi/Chín phía trên (ghi chú dài nhiều dòng thì cao thêm)
  const noteH = n => Math.max(TOP_H, n * NOTE_LH + 12);
  const rowH = r => { const n = (noteOf.get(r) || []).length; return n ? Math.max(H_ROW, TOP_H + noteH(n), 2 * noteH(n) * (n === 1)) : H_ROW; };
  const valH = r => { const n = (noteOf.get(r) || []).length, h = rowH(r); return n ? (n === 1 ? h / 2 : h - noteH(n)) : h; };
  const noteOf = new Map();
  rows.forEach(r => { const t = String(r.ghichu ?? '').trim(); noteOf.set(r, t && iP0 >= 0 ? wrapNote(t) : []); });
  // nhãn "Tổng cộng" cần đủ chỗ
  const labW = tw('TỔNG CỘNG TẤT CẢ :', 800, FS) + 40;
  let leftW = widths.slice(0, iThuc).reduce((a, b) => a + b, 0);
  if (leftW < labW){ const add = Math.ceil((labW - leftW) / Math.max(1, iThuc)); for (let k = 0; k < iThuc; k++) widths[k] += add; leftW = widths.slice(0, iThuc).reduce((a, b) => a + b, 0); }
  const tableW = widths.reduce((a, b) => a + b, 0);
  const M = 24, TOP = 92;
  const hDate = isMerged() ? 0 : H_DATE;
  let tableH = H_HEAD + gs.reduce((a, g) => a + hDate + g.rows.reduce((s2, r) => s2 + rowH(r), 0) + H_TOT, 0) + (gs.length > 1 ? H_GRAND : 0);
  const SUMH = 96;
  const Wc = Math.max(tableW + M * 2, 640), Hc = TOP + tableH + SUMH + 34;
  const cv = mkCanvas(Wc * S, Hc * S), g = cv.getContext('2d');
  g.scale(S, S);
  g.fillStyle = '#fff'; g.fillRect(0, 0, Wc, Hc);
  g.textBaseline = 'middle';
  // tiêu đề
  // tiêu đề in hoa, logo + chữ căn giữa phiếu
  const TITLE = 'PHIẾU BÁO CÁO CÀ TƯƠI';
  g.font = `800 28px ${SANS}`; const titleW = g.measureText(TITLE).width;
  const gx = Math.round(Wc / 2 - (54 + 16 + titleW) / 2), tx = gx + 70;
  if (logo){ g.save(); roundRect(g, gx, 20, 54, 54, 13); g.clip(); if (mono) g.filter = 'grayscale(1)'; g.drawImage(logo, gx, 20, 54, 54); g.restore(); }
  const dates = groups().map(x => x.date).filter(Boolean);
  const range = dates.length ? (dates.length > 1 ? `${dates[0]} – ${dates[dates.length - 1]}` : dates[0]) : '';
  g.fillStyle = T('#1b5f8c'); g.font = `800 26px ${SANS}`; g.textAlign = 'left';
  g.fillText(TITLE, tx, 37);
  g.fillStyle = T('#5a7d93'); g.font = `600 15.5px ${SANS}`;
  g.textAlign = 'center'; g.fillText([range ? 'Ngày ' + range : '', `${rows.length} xe`].filter(Boolean).join('  ·  '), tx + titleW / 2, 63);
  // bảng
  const X0 = M + Math.max(0, (Wc - M * 2 - tableW) / 2), xs = [X0]; widths.forEach(w => xs.push(xs[xs.length - 1] + w));
  const XE = xs[xs.length - 1];
  let y = TOP; const brk = [TOP];
  const line = (x1, y1, x2, y2, w = 1.6) => { g.beginPath(); g.lineWidth = w; g.strokeStyle = '#000'; g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
  const nxFill = (y1, h, c) => cols.forEach(([f], k) => { if (isNX(f)){ g.fillStyle = c; g.fillRect(xs[k], y1, widths[k], h); } });
  const txt = (t, x, yy, align = 'center', w = 400, sz = FS, color = '#000') => { g.font = `${w} ${sz}px ${SERIF}`; g.fillStyle = color; g.textAlign = align; g.fillText(t, x, yy); };
  const cellX = (k, align) => align === 'right' ? xs[k + 1] - PADX : align === 'left' ? xs[k] + PADX : (xs[k] + xs[k + 1]) / 2;
  // header
  nxFill(y, H_HEAD, F('#dceffb'));
  cols.forEach(([f, t], k) => txt(t, cellX(k), y + H_HEAD / 2 + 1, 'center', isNX(f) ? 700 : 400, FS, T(isNX(f) ? '#0f4c75' : '#000')));
  line(X0, y, XE, y); xs.forEach(x => line(x, y, x, y + H_HEAD));
  y += H_HEAD; brk.push(y);
  gs.forEach(gr => {
    if (!isMerged()){
      line(X0, y, XE, y);
      line(X0, y, X0, y + H_DATE); line(XE, y, XE, y + H_DATE);
      txt(`Ngày cân : ${gr.date || '…'}`, X0 + Math.min(76, widths[0] + 30), y + H_DATE / 2 + 1, 'left', 700);
      y += H_DATE; brk.push(y);
    }
    gr.rows.forEach((r, i) => {
      const note = noteOf.get(r) || [], h = rowH(r), pfH = valH(r);
      line(X0, y, XE, y);
      nxFill(y + 0.8, pfH - 1.6, F('#eef7fd'));
      cols.forEach(([f], k) => {
        const ls = cellText(r, f, i);
        const al = f === 'thuc' ? 'right' : 'center';
        const cy = y + (isNX(f) ? pfH : h) / 2 + 1;
        if (isNX(f) && !ls[0]){ txt('–', cellX(k), cy, 'center', 400, FS, T('#9ab')); return; }
        ls.forEach((l, j) => txt(l, cellX(k, al), cy + (j - (ls.length - 1) / 2) * LH, al));
      });
      xs.forEach((x, k) => line(x, y, x, y + (note.length && k > iP0 && k <= iP1 ? pfH : h)));
      if (note.length){
        line(xs[iP0], y + pfH, xs[iP1 + 1], y + pfH);
        const cx = (xs[iP0] + xs[iP1 + 1]) / 2, ny = y + pfH + (h - pfH) / 2 + 1;
        note.forEach((l, j) => { g.font = `400 ${NOTE_FS}px ${SERIF}`; g.fillStyle = '#000'; g.textAlign = 'center'; g.fillText(l, cx, ny + (j - (note.length - 1) / 2) * NOTE_LH); });
      }
      y += h; brk.push(y);
    });
    // tổng ngày
    const a = agg(gr.rows);
    line(X0, y, XE, y);
    nxFill(y + 0.8, H_TOT - 1.6, F('#dceffb'));
    txt('Tổng cộng :', xs[iThuc] - 30, y + H_TOT / 2 + 1, 'right', 700);
    txt(fmtKg(a.tl), cellX(iThuc, 'right'), y + H_TOT / 2 + 1, 'right', 700);
    cols.forEach(([f], k) => { if (isPF(f)) txt(fmtPct(a[{ xanh: 'x', noi: 'n', chin: 'c' }[f]]), cellX(k), y + H_TOT / 2 + 1, 'center', 700, FS, T('#0f4c75')); });
    line(X0, y, X0, y + H_TOT); line(XE, y, XE, y + H_TOT);
    cols.forEach(([f], k) => { if (isNX(f)){ line(xs[k], y, xs[k], y + H_TOT); } });
    y += H_TOT; brk.push(y);
  });
  if (gs.length > 1){
    line(X0, y, XE, y);
    g.fillStyle = F('#d7eefc'); g.fillRect(X0, y, XE - X0, H_GRAND);
    nxFill(y, H_GRAND, F('#c2e2f7'));
    txt('TỔNG CỘNG TẤT CẢ :', xs[iThuc] - 30, y + H_GRAND / 2 + 1, 'right', 800);
    txt(fmtKg(A.tl), cellX(iThuc, 'right'), y + H_GRAND / 2 + 1, 'right', 800, FS + 1);
    cols.forEach(([f], k) => { if (isPF(f)) txt(fmtPct(A[{ xanh: 'x', noi: 'n', chin: 'c' }[f]]), cellX(k), y + H_GRAND / 2 + 1, 'center', 800, FS + 1, T('#0f4c75')); });
    line(X0, y, X0, y + H_GRAND); line(XE, y, XE, y + H_GRAND);
    cols.forEach(([f], k) => { if (isNX(f)) line(xs[k], y, xs[k], y + H_GRAND); });
    y += H_GRAND; brk.push(y);
  }
  line(X0, y, XE, y);
  // ô tổng kết
  y += 20;
  const boxes = [['Tổng khối lượng', fmtKg(A.tl) + ' kg', '#d7eefc', '#164a6e'], ['TB Xanh', fmtPct(A.x) + ' %', '#eef7fd', '#0f4c75'], ['TB Nổi', fmtPct(A.n) + ' %', '#eef7fd', '#0f4c75'], ['TB Chín', fmtPct(A.c) + ' %', '#eef7fd', '#0f4c75']];
  const gap = 12, bw = (XE - X0 - gap * (boxes.length - 1)) / boxes.length;
  boxes.forEach(([l, v, bg, fg], k) => {
    const bx = X0 + k * (bw + gap);
    g.fillStyle = F(bg); roundRect(g, bx, y, bw, 70, 14); g.fill(); if (mono){ g.lineWidth = 1.4; g.strokeStyle = '#000'; g.stroke(); }
    g.textAlign = 'left'; g.fillStyle = T('#4c7590'); g.font = `700 14.5px ${SANS}`; g.fillText(l, bx + 16, y + 22);
    g.fillStyle = T(fg); g.font = `800 ${bw < 170 ? 20 : bw < 220 ? 23 : 27}px ${SANS}`; g.fillText(v, bx + 16, y + 49);
  });
  g.textAlign = 'left'; g.fillStyle = T('#7b98aa'); g.font = `500 12.5px ${SANS}`;
  g.fillText('TB có trọng số theo TL thực = Σ(TL thực × %) ÷ Σ TL thực', X0, y + 70 + 20);
  cv.hdr = { cols: cols.map(c => c[0]), xs: xs.slice(), top: TOP, h: H_HEAD, W: Wc, H: Hc };
  cv.breaks = brk; cv.head = [TOP, TOP + H_HEAD]; cv.cssW = Wc; cv.cssH = Hc; cv.S = S;   // ranh giới dòng + dòng tiêu đề để chia trang A4
  return cv;
}
function roundRect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
let expTimer = null, lastBlob = null;
function scheduleExport(){
  clearTimeout(expTimer);
  expTimer = setTimeout(renderExport, 300);
}
async function renderExport(){
  const card = $('#expCard');
  if (!rows.length){ card.hidden = true; return; }
  card.hidden = false;
  if ($('#prevWrap').hidden) return;          // phiếu đang thu gọn: chỉ vẽ khi mở ra
  try {
    const c = await makeCanvas();
    drawHot(c.hdr);
    lastBlob = await new Promise(r => c.toBlob(r, 'image/png'));
    const url = URL.createObjectURL(lastBlob);
    const old = $('#prev').src; $('#prev').src = url; if (old.startsWith('blob:')) setTimeout(() => URL.revokeObjectURL(old), 1000);
  } catch(e){ console.error(e); }
}
async function freshBlob(mono = false){
  clearTimeout(expTimer);
  const c = await makeCanvas(mono);
  return new Promise(r => c.toBlob(r, 'image/png'));
}
/* Sắp xếp phiếu theo cột (gộp ngày: cả phiếu; tách ngày: trong từng ngày); bảng dữ liệu giữ nguyên thứ tự */
// Sắp xếp nhiều mức như Data → Sort của Excel: [{ key, dir }, …]; mức sau chỉ xét khi các mức trước bằng nhau
let sortLv = (() => {
  const v = LS.get('tbxn_sort', null);
  if (Array.isArray(v)) return v.filter(x => x && x.key);
  return v && v.key ? [{ key: v.key, dir: v.dir || 'asc' }] : [];   // định dạng cũ (1 cột)
})();
const saveSort = () => LS.set('tbxn_sort', sortLv);
function sortVal(r, f){
  if (f === 'date'){ const m = String(r.date || '').match(/(\d{1,2})\D+(\d{1,2})\D+(\d{4})/); return m ? +m[3] * 1e4 + +m[2] * 100 + +m[1] : null; }
  if (f === 'gio'){ const t = String(r.gio || '').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/); if (!t) return null; const hms = +t[1] * 1e4 + +t[2] * 100 + +(t[3] || 0);
    const d = isMerged() ? sortVal(r, 'date') : null; return (d || 0) * 1e6 + hms; }   // gộp ngày: theo ngày rồi giờ
  if (NUMF.has(f)) return parseKg(r[f]);
  if (isPF(f)) return pcts(r).v[f];
  if (f === 'stt'){ const n = parseInt(r.stt, 10); return isNaN(n) ? null : n; }
  const t = String(r[f] ?? '').trim(); return t || null;
}
function cmpRows(a, b){
  for (const { key, dir } of sortLv){
    const va = sortVal(a, key), vb = sortVal(b, key);
    if (va == null || vb == null){ if (va == null && vb == null) continue; return va == null ? 1 : -1; }   // ô trống luôn ở cuối
    const c = typeof va === 'number' && typeof vb === 'number' ? va - vb : String(va).localeCompare(String(vb), 'vi', { numeric: true, sensitivity: 'base' });
    if (c) return dir === 'desc' ? -c : c;
  }
  return 0;   // bằng nhau ở mọi mức: giữ thứ tự gốc
}
function sheetGroups(){
  const gs = isMerged() ? [{ date: '', rows: groups().flatMap(g => g.rows) }] : groups();
  if (!sortLv.length) return gs;
  return gs.map(g => ({ date: g.date, rows: [...g.rows].sort(cmpRows) }));
}
function sortCols(){
  const cols = [...sheetCols(), ['ghichu','Ghi chú']];
  if (isMerged() && multiDay() && !cols.some(c => c[0] === 'date')) cols.splice(1, 0, ['date','Ngày cân']);
  return cols;
}
// Mũi tên trên hàng tiêu đề của phiếu: bấm 1 lần tăng dần, lần 2 giảm dần, lần 3 bỏ; bấm cột khác = sắp xếp tiếp theo cột đó
function colLabel(f){ const c = sortCols().find(x => x[0] === f); return c ? c[1].replace(/\s*\(%\)/, '') : f; }
function fillSortOpts(){
  const have = new Set(sortCols().map(c => c[0]));
  const before = sortLv.length;
  sortLv = sortLv.filter(l => have.has(l.key));
  if (sortLv.length !== before) saveSort();
  const box = $('#sortLevels');
  box.innerHTML = sortLv.length
    ? sortLv.map((l, i) => `${i ? '<span class="sthen">rồi</span>' : ''}<span class="schip"><b>${i + 1}</b>${esc(colLabel(l.key))} ${l.dir === 'desc' ? '↓' : '↑'}</span>`).join('') +
      ' <button type="button" class="ghost" id="sortClear">✕ Bỏ sắp xếp</button>'
    : `<span class="shint">${$('#prevWrap').hidden ? 'Mở phiếu rồi bấm' : 'Bấm'} vào tiêu đề cột trên phiếu để sắp xếp</span>`;
  document.querySelectorAll('#grpSeg button').forEach(b => b.classList.toggle('on', b.dataset.g === grpMode));
}
function drawHot(h){
  const box = $('#hot'); if (!box || !h) return;
  box.innerHTML = h.cols.map((f, k) => {
    const i = sortLv.findIndex(l => l.key === f), l = sortLv[i];
    const ar = l ? `<span class="ar">${l.dir === 'desc' ? '▼' : '▲'}${sortLv.length > 1 ? i + 1 : ''}</span>` : '<span class="ar idle">⇅</span>';
    const st = `left:${(h.xs[k] / h.W * 100).toFixed(3)}%;width:${((h.xs[k + 1] - h.xs[k]) / h.W * 100).toFixed(3)}%;top:${(h.top / h.H * 100).toFixed(3)}%;height:${(h.h / h.H * 100).toFixed(3)}%`;
    const tip = !l ? `Sắp xếp theo ${colLabel(f)} (tăng dần)` : l.dir !== 'desc' ? `Đổi ${colLabel(f)} sang giảm dần` : `Bỏ sắp xếp theo ${colLabel(f)}`;
    return `<button type="button" data-sort="${f}" class="${l ? 'on' : ''}" style="${st}" title="${esc(tip)}" aria-label="Sắp xếp theo ${esc(colLabel(f))}">${ar}</button>`;
  }).join('');
}
$('#hot').addEventListener('click', e => {
  const b = e.target.closest('[data-sort]'); if (!b) return;
  e.stopPropagation();
  const f = b.dataset.sort, i = sortLv.findIndex(l => l.key === f);
  if (i < 0) sortLv.push({ key: f, dir: 'asc' });
  else if (sortLv[i].dir !== 'desc') sortLv[i].dir = 'desc';
  else sortLv.splice(i, 1);
  saveSort(); fillSortOpts(); renderExport();
});
document.querySelectorAll('#grpSeg button').forEach(b => b.addEventListener('click', () => { grpMode = b.dataset.g; LS.set('tbxn_grp', grpMode); fillSortOpts(); renderExport(); }));
$('#sortLevels').addEventListener('click', e => { if (e.target.closest('#sortClear')){ sortLv = []; saveSort(); fillSortOpts(); renderExport(); } });
function fileName(){ const g = groups(); const d = (g[0] && g[0].date || today()).replace(/\D+/g, '-'); return `phieu-ca-tuoi_${d}.png`; }
document.querySelectorAll('#expSeg button').forEach(b => {
  b.classList.toggle('on', b.dataset.e === expMode);
  b.addEventListener('click', () => { expMode = b.dataset.e; LS.set('tbxn_exp', expMode); document.querySelectorAll('#expSeg button').forEach(x => x.classList.toggle('on', x === b)); fillSortOpts(); renderExport(); });
});

// Sao chép: phiếu vừa 1 trang A4 -> sao chép ảnh; dài hơn -> tải PDF (bộ nhớ tạm không chứa được PDF)
$('#copyImg').addEventListener('click', async () => {
  const spP = sheetPages(false);
  try {
    if (!navigator.clipboard || !window.ClipboardItem) throw new Error('nosupport');
    // Truyền Promise vào ClipboardItem để Safari/iOS giữ thao tác người dùng
    const pngP = spP.then(sp => sp.pages.length === 1 ? new Promise(r => sp.cv.toBlob(r, 'image/png')) : Promise.reject(new Error('multipage')));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngP })]);
    toast('✅ Đã sao chép ảnh');
  } catch(e){
    const sp = await spP.catch(() => null);
    if (sp && sp.pages.length > 1){
      await download(sp);
      toast(`Phiếu dài ${sp.pages.length} trang A4 — đã tải về dạng PDF thay vì sao chép ảnh`, 5000);
      return;
    }
    const ok = await shareBlob(sp).catch(() => false);
    if (!ok) toast('Trình duyệt chưa hỗ trợ sao chép ảnh. Hãy dùng “Tải PDF”.');
  }
});
/* ---------- PDF: tự ghép, không cần thư viện. Ảnh phiếu (JPEG) đặt vào khổ A4, chia trang tại ranh giới dòng ---------- */
// Chia phiếu thành các trang A4 (giống khi in): cắt tại ranh giới dòng, trang sau lặp lại dòng tiêu đề bảng
async function sheetPages(mono = false, fit = 1){
  clearTimeout(expTimer);
  const cv = await makeCanvas(mono);
  const W = cv.cssW, H = cv.cssH, S = cv.S;
  const land = W > 1100;                                   // phiếu nhiều cột: khổ ngang
  const PW = land ? 841.89 : 595.28, PH = land ? 595.28 : 841.89, MG = 22;   // A4 (pt), lề ~8mm
  const k = Math.min((PW - MG * 2) / W, 1.2);               // pt trên mỗi px
  const maxH = (PH - MG * 2) / k * fit;          // fit < 1: chừa chỗ cho giấy Letter / đầu-chân trang khi in

  const slices = [];
  for (let y0 = 0; y0 < H - 1;){
    const cap = slices.length ? maxH - hh : maxH;
    let y1 = H - y0 <= cap ? H : (br.filter(b => b > y0 + 1 && b <= y0 + cap).pop() || y0 + cap);
    slices.push([y0, y1]); y0 = y1;

    const head = i > 0 && a >= h1 ? hh : 0, ph = b - a + head;

    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    if (head) g.drawImage(cv, 0, (h0 - 1) * S, W * S, (hh + 1) * S, 0, 0, W * S, (hh + 1) * S);
    g.drawImage(cv, 0, a2 * S, W * S, (b2 - a2) * S, 0, head * S, W * S, (b2 - a2) * S);
    return { canvas: c, dw: W * k, dh: ph2 * k };
  });

}
async function pdfBlob(sp){
  sp = sp || await sheetPages(false);
  const pages = [];
  for (const p of sp.pages){
    const jpg = new Uint8Array(await (await new Promise(r => p.canvas.toBlob(r, 'image/jpeg', 0.9))).arrayBuffer());
    pages.push({ jpg, w: p.canvas.width, h: p.canvas.height, dw: p.dw, dh: p.dh });
  }

}
function buildPdf(pages, PW, PH, MG){
  const enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const put = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; put(`${n} 0 obj\n`); body(); put('\nendobj\n'); };
  put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const n = pages.length, kids = pages.map((_, i) => `${3 + i * 3} 0 R`).join(' ');
  obj(1, () => put('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => put(`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`));
  pages.forEach((p, i) => {
    const pg = 3 + i * 3, im = pg + 1, ct = pg + 2;
    const cs = `q ${p.dw.toFixed(2)} 0 0 ${p.dh.toFixed(2)} ${((PW - p.dw) / 2).toFixed(2)} ${(PH - MG - p.dh).toFixed(2)} cm /Im0 Do Q`;
    obj(pg, () => put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`));
    obj(im, () => { put(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`); put(p.jpg); put('\nendstream'); });
    obj(ct, () => put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  });
  const total = 3 + n * 3, xref = len;
  put(`xref\n0 ${total}\n0000000000 65535 f \n` + offs.slice(1, total).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join(''));
  put(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}

async function pdfToImages(file){

let workerP = null, workerProgress = null;
/* Giới hạn thời gian để không bao giờ chờ quá lâu, kể cả khi ảnh không đọc được */
const LIM = { worker: 45000, full: 25000, soft: 20000, hard: 35000, abs: 45000, gemini: 30000, pdf: 20000 };
let job = null;   // { t0, cancelled, ctl }
const elapsed = () => job ? Date.now() - job.t0 - (job.extra || 0) : 0;   // ảnh lớn được cộng thêm thời gian
const late = () => elapsed() > LIM.soft;     // bỏ các bước đọc lại không bắt buộc
const veryLate = () => elapsed() > LIM.hard; // bỏ đọc chữ viết tay cho các dòng còn lại
class StopErr extends Error {}
function check(){
  if (!job) return;
  if (job.cancelled) throw new StopErr('Đã huỷ');
  if (elapsed() > LIM.abs) throw new StopErr('Quá thời gian đọc ảnh');
}
function withTimeout(p, ms, msg){
  let t, onCancel;
  const guard = new Promise((_, rej) => {
    t = setTimeout(() => rej(new StopErr(msg)), Math.max(0, ms));
    if (job){ onCancel = () => rej(new StopErr('Đã huỷ')); job.ctl.signal.addEventListener('abort', onCancel, { once: true }); }
  });
  return Promise.race([p, guard]).finally(() => { clearTimeout(t); if (job && onCancel) job.ctl.signal.removeEventListener('abort', onCancel); });
}
function killWorker(){ const p = workerP; workerP = null; if (p) p.then(w => w.terminate()).catch(() => {}); }
function getWorker(){
  if (!workerP){
    if (!window.Tesseract) return Promise.reject(new Error('Chưa tải được bộ nhận dạng chữ (kiểm tra kết nối mạng).'));
    workerP = Tesseract.createWorker('vie', 1, {
      logger: m => { if (workerProgress) workerProgress(m); }
    }).catch(e => { workerP = null; throw e; });
  }
  return workerP;
}
async function ocr(canvas, { psm = '6', whitelist = '' } = {}){
  check();
  const w = await withTimeout(getWorker(), LIM.worker, 'Tải bộ nhận dạng quá lâu — kiểm tra mạng rồi thử lại');
  try {
    await w.setParameters({ tessedit_pageseg_mode: String(psm), tessedit_char_whitelist: whitelist, preserve_interword_spaces: '1' });
    const { data } = await withTimeout(w.recognize(canvas, {}, { text: true, tsv: true, blocks: false, hocr: false }),
      LIM.abs - elapsed(), 'Quá thời gian đọc ảnh');
    return { text: data.text || '', words: parseTSV(data.tsv || '') };
  } catch(e){
    if (e instanceof StopErr) killWorker();   // bộ đọc đang kẹt: dừng hẳn, lần sau tạo lại
    throw e;
  }
}
function parseTSV(tsv){
  const out = [];
  tsv.split('\n').forEach(line => {
    const p = line.split('\t');
    if (p.length < 12 || p[0] !== '5') return;
    const t = p.slice(11).join('\t').trim();
    if (!t) return;
    const x0 = +p[6], y0 = +p[7], w = +p[8], h = +p[9];
    out.push({ t, x0, y0, x1: x0 + w, y1: y0 + h, cx: x0 + w / 2, cy: y0 + h / 2, h, conf: +p[10], line: p[2] + '.' + p[3] + '.' + p[4] });
  });
  return out;
}

function mkCanvas(w, h){ const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

// Ước lượng góc nghiêng (độ) bằng phép chiếu: góc làm các dòng/đường kẻ "sắc" nhất
function estimateSkew(bmp){

    const p = i * 4, v = (d[p] * 299 + d[p + 1] * 587 + d[p + 2] * 114) / 1000 * 255 / bgOf(i);
    if (v < 120){ xs.push(x - w / 2); ys.push(y); }
  }

// Làm mượt hộp (2r+1)^2 bằng ảnh tích phân
function boxBlur(a, W, H, r){

    for (let x = 0; x < W; x++){ const x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1);

// Nới rộng mặt nạ (max-filter tách theo 2 chiều)
function dilate(m, W, H, r){

    last = 1e9; for (let x = W - 1; x >= 0; x--){ if (m[b + x]) last = x; if (last - x <= r) t[b + x] = 1; } }
  for (let x = 0; x < W; x++){ let last = -1e9;
    for (let y = 0; y < H; y++){ if (t[y * W + x]) last = y; if (y - last <= r) o[y * W + x] = 1; }
    last = 1e9; for (let y = H - 1; y >= 0; y--){ if (t[y * W + x]) last = y; if (last - y <= r) o[y * W + x] = 1; } }

// Nền giấy theo từng vùng (lấy giá trị sáng nhất lân cận) -> hàm tra theo chỉ số điểm ảnh
function background(d, W, H, ch = -1){   // ch = -1: độ sáng; 0/1/2: riêng kênh R/G/B (nền có màu nhạt -> trắng)
  const B = 32, bw = Math.ceil(W / B), bh = Math.ceil(H / B), m = new Float32Array(bw * bh);
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2){
    const p = (y * W + x) * 4, v = ch < 0 ? (d[p] * 299 + d[p + 1] * 587 + d[p + 2] * 114) / 1000 : d[p + ch], k = ((y / B) | 0) * bw + ((x / B) | 0);
    if (v > m[k]) m[k] = v;
  }
  const m2 = new Float32Array(bw * bh);
  for (let by = 0; by < bh; by++) for (let bx = 0; bx < bw; bx++){
    let mx = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
      const yy = by + dy, xx = bx + dx; if (yy >= 0 && yy < bh && xx >= 0 && xx < bw) mx = Math.max(mx, m[yy * bw + xx]);
    }
    m2[by * bw + bx] = Math.max(90, mx);
  }
  return i => {
    const y = (i / W) | 0, x = i - y * W;
    const fx = Math.min(bw - 1, Math.max(0, x / B - 0.5)), fy = Math.min(bh - 1, Math.max(0, y / B - 0.5));
    const x0 = fx | 0, y0 = fy | 0, x1 = Math.min(bw - 1, x0 + 1), y1 = Math.min(bh - 1, y0 + 1), ax = fx - x0, ay = fy - y0;
    return (m2[y0 * bw + x0] * (1 - ax) + m2[y0 * bw + x1] * ax) * (1 - ay) + (m2[y1 * bw + x0] * (1 - ax) + m2[y1 * bw + x1] * ax) * ay;
  };
}

// Phân tích lưới bảng: đường kẻ ngang, dọc từng dải, ô
function analyzeGrid(gray, ink, W, H){
  const dark = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) dark[i] = gray[i] < 150 && !ink[i] ? 1 : 0;
  // đường ngang
  const hy = [], bestRun = new Int32Array(H);
  for (let y = 0; y < H; y++){
    let run = 0, best = 0, o = y * W;
    for (let x = 0, gap = 0; x < W; x++){ if (dark[o + x]){ run++; gap = 0; if (run > best) best = run; } else if (++gap > 3){ run = 0; } }
    bestRun[y] = best;
  }
  // đường kẻ hàng phải dài gần bằng bề ngang bảng (đường kẻ ngắn dưới riêng vài cột, vd. ô ghi chú, không tách hàng)
  let maxRun = 0; for (let y = 0; y < H; y++) if (bestRun[y] > maxRun) maxRun = bestRun[y];
  const need = Math.max(W * 0.3, maxRun * 0.75);
  for (let y = 0; y < H; y++) if (bestRun[y] >= need) hy.push(y);
  const hLines = [];
  hy.forEach(y => { const L = hLines[hLines.length - 1]; if (L && y - L.y1 <= 2) L.y1 = y; else hLines.push({ y0: y, y1: y }); });
  // các dải giữa 2 đường ngang
  const bands = [];
  const edges = [{ y0: -1, y1: -1 }, ...hLines, { y0: H, y1: H }];
  for (let i = 0; i < edges.length - 1; i++){
    const y0 = edges[i].y1 + 1, y1 = edges[i + 1].y0 - 1;
    if (y1 - y0 < 12) continue;
    // đường dọc trong dải
    const hh = y1 - y0 + 1, need = Math.max(6, (hh - 4) * 0.88);
    const vx = [];
    for (let x = 0; x < W; x++){
      let c = 0;
      for (let y = y0 + 2; y <= y1 - 2; y++) c += dark[y * W + x];
      if (c >= need) vx.push(x);
    }
    const seps = [];
    vx.forEach(x => { const s = seps[seps.length - 1]; if (s && x - s.x1 <= 2) s.x1 = x; else seps.push({ x0: x, x1: x }); });
    const bounds = [-1, ...seps.flatMap(s => [s.x0, s.x1]), W];
    const cells = [];
    for (let k = 0; k < bounds.length - 1; k += 2){
      const a = bounds[k] + 1, b = bounds[k + 1] - 1;
      if (b - a >= Math.max(14, W * 0.012)) cells.push({ x0: a, x1: b });
    }
    // dải bị ngăn ở mép (chỉ có viền ngoài) => 1 ô
    bands.push({ y0, y1, seps, cells, top: i > 0, bottom: i < edges.length - 2 });
  }
  return { hLines, bands, dark };
}

async function readLocal(blob){
  const bmp = await loadBitmap(blob);
  const iw = bmp.width, ih = bmp.height;
  let scale = iw < 1100 ? 2.5 : iw < 2000 ? 2 : iw < 3000 ? 1.3 : 1;
  while (iw * ih * scale * scale > 9e6 && scale > 0.5) scale = Math.round((scale - 0.1) * 10) / 10;
  // Ảnh chụp bằng điện thoại thường hơi nghiêng: ước lượng góc rồi xoay thẳng

    const rn = Math.min(255, r * 255 / bgR(i)), gn = Math.min(255, g * 255 / bgG(i)), bn = Math.min(255, b * 255 / bgB(i));
    chB[i] = bn - (rn + gn) / 2; chR[i] = rn - gn; chBG[i] = bn - gn;

  for (let i = 0; i < W * H; i++){
    // mực bút xanh: lam vượt hẳn cả đỏ lẫn lục; chữ in xanh đậm (navy, lam ≈ lục) không bị coi là mực bút
    const blue = chB[i] > 25 && sB[i] > 22 && sB[i] > 0.4 * sD[i] && sBG[i] > 0.3 * sD[i];
    const red = chR[i] > 40 && sR[i] > 35 && sR[i] > 0.45 * sD[i];
    ink[i] = gray[i] < 225 && (blue || red) ? 1 : 0;
  }

  sctx.putImageData(img, 0, 0);
  progress(0.08, 'Đang tìm đường kẻ bảng…');
  // Ảnh quá tối / nhiễu (không phải phiếu in nền sáng) -> báo ngay, khỏi chờ

  grid.bands.forEach(b => b.seps.forEach(s => { for (let y = b.y0; y <= b.y1; y++) for (let x = Math.max(0, s.x0 - 1); x <= Math.min(W - 1, s.x1 + 1); x++) isLine[y * W + x] = 1; }));

    else if (/load|initializ/i.test(m.status)) progress(0.1, 'Đang tải bộ nhận dạng tiếng Việt (chỉ lần đầu)…');
  };
  if (job) job.extra = Math.min(35000, Math.max(0, (W * H / 1e6 - 3) * 5000));   // phiếu lớn / nhiều dòng: cho thêm thời gian
  const full = await withTimeout(ocr(clean, { psm: '11' }), LIM.full + (job ? job.extra : 0), 'Không đọc được trong thời gian cho phép').catch(e => { if (e instanceof StopErr) killWorker(); throw e; });
  if (!full.words.some(w => /\d/.test(w.t))) throw new Error('Không thấy chữ số nào trong ảnh');
  workerProgress = null;
  const words = full.words;

  let rowsOut = [];
  const dataBands = grid.bands.filter(b => b.cells.length >= 4);
  if (grid.hLines.length >= 3 && dataBands.length >= 2){
    rowsOut = await parseGrid(grid, words, { W, H, gray, ink, isLine, src, clean, scale });
  }
  if (!rowsOut.length){

}

function mapHeader(cellTexts){
  const map = {};
  cellTexts.forEach((t, i) => {
    const n = norm(t).replace(/\s+/g, ' ');
    if (/xanh/.test(n)) map.xanh = i;                       // phiếu đã có cột Xanh / Nổi / Chín in sẵn
    else if (/^\W*n.i\b|^\W*noi/.test(n) && !/ng.y/.test(n)) map.noi = i;
    else if (/ch.n\b|chin/.test(n) && !/kh/.test(n)) map.chin = i;
    else if (/ghi\s*ch/.test(n)) map.ghichu = i;
    else if (/stt/.test(n)) map.stt = i;
    else if (/so\s*xe|xe$/.test(n)) map.soxe = i;
    else if (/kh.?ch/.test(n)) map.khach = i;
    else if (/l.n\s*1|lan1/.test(n)) map.tl1 = i;
    else if (/l.n\s*2|lan2/.test(n)) map.tl2 = i;
    else if (/tl\s*th|th.?c/.test(n) && /tl|th/.test(n)) map.thuc = i;
    else if (/gi.\s*c|gio|can$/.test(n) && (!/ngay/.test(n) || /gio/.test(n))) map.gio = i;   // "Giờ / Ngày cân" vẫn là cột giờ
    else if (/ngay/.test(n)) map.date = i;
    else if (/\bbi\b|tl\s*b/.test(n)) map.bi = i;
    else if (/tl\s*h/.test(n)) map.tlh = i;
    else if (/h.ng\s*h|hoa/.test(n)) map.hang = i;
  });
  // cột sau TL Thực / Giờ cân có "(%)" mà chưa nhận ra -> lần lượt Xanh, Nổi, Chín
  const last = Math.max(map.thuc ?? -1, map.gio ?? -1);
  if (last >= 0){
    const miss = PF.filter(f => map[f] == null);
    cellTexts.forEach((t, i) => { if (i > last && miss.length && /[%(°]|\(.\)/.test(t) && !Object.values(map).includes(i)) map[miss.shift()] = i; });
  }
  return map;
}
