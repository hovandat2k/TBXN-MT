    PF.forEach(f => {
      const ref = map[f] != null && colX[map[f]]; if (!ref) return;
      const cand = ws.filter(w => w.cx >= ref.x0 && w.cx <= ref.x1 && isVal(w.t)).sort((a, b2) => a.cy - b2.cy)[0];
      if (cand){ r[f] = String(+cand.t.replace(',', '.')); used.add(cand); }
    });
    const xs0 = Math.min(...PF.filter(f => map[f] != null && colX[map[f]]).map(f => colX[map[f]].x0));
    const xs1 = Math.max(...PF.filter(f => map[f] != null && colX[map[f]]).map(f => colX[map[f]].x1));
    const topY = used.size ? Math.max(...[...used].map(w => w.y1)) : b.y0;
    const note = ws.filter(w => !used.has(w) && w.cx >= xs0 && w.cx <= xs1 && w.cy > topY && !isDash(w.t));
    if (note.length) r.ghichu = cleanText(joinWords(note)).replace(/^\s*gh?[il1]\s*ch\S*\s*:?\s*/i, '');
    r._printed = true;
  }
  for (let i = hdrIdx + 1; i < bands.length; i++){
    const b = bands[i];
    const txt = joinWords(wIn(b));
    const dm = txt.match(reDate);
    if (b.cells.length < Math.max(4, nCells - 2)){
      if (dm && /ng.y|can|c.n/i.test(norm(txt))) date = fixDate(dm);
      else if (dm && b.cells.length <= 2 && !/t.ng|cong/.test(norm(txt))) date = fixDate(dm);
      continue;
    }
    if (/t.ng\s*c.ng/.test(norm(txt))) continue;
    // dòng tổng / dòng ngày (không có đường kẻ sau cột STT) -> bỏ qua
    if (hdrIdx >= 0 && map.stt != null && colX && colX[map.stt] && !b.cells.some(c => Math.abs(c.x1 - colX[map.stt].x1) < 10 * ctx.scale)) continue;
    // ánh xạ ô theo toạ độ cột tiêu đề (an toàn khi số ô lệch)
    const cellOf = k => {
      const ref = colX && colX[map[k]]; if (!ref) return b.cells[map[k]];
      return b.cells.reduce((best, c) => {
        const ov = Math.min(c.x1, ref.x1) - Math.max(c.x0, ref.x0);
        return ov > (best ? Math.min(best.x1, ref.x1) - Math.max(best.x0, ref.x0) : 0) ? c : best;
      }, null) || ref;
    };
    const get = k => { if (map[k] == null) return ''; const c = cellOf(k); return c ? joinWords(wIn(b, c)) : ''; };
    const r = { date, flags: {}, _band: i, _cells: {} };
    ['stt','soxe','hang','khach','tl1','tl2','tlh','bi','thuc','gio'].forEach(k => { r[k] = get(k); if (map[k] != null) r._cells[k] = cellOf(k); });
    if (!/\d/.test(r.thuc) && !/\d/.test(r.tlh) && !reTime.test(r.gio)) continue;   // dòng tiêu đề / dòng rác
    // phiếu gộp ngày: ngày cân ghi trong ô giờ hoặc cột Ngày cân
    { const dm2 = (r.gio + ' ' + get('date')).match(reDate); if (dm2) r.date = fixDate(dm2); }
    if (hasPF) readPrintedPF(r, b);
    r.khach = cleanText(r.khach); r.hang = cleanText(r.hang); r.soxe = cleanText(r.soxe);
    r.stt = (r.stt.match(/\d+/) || [''])[0];
    const tm = r.gio.match(/(\d{1,2})[:.;](\d{2})(?:[:.;](\d{2}))?/);
    r.gio = tm ? [tm[1].padStart(2, '0'), tm[2], tm[3]].filter(Boolean).join(':') : cleanText(r.gio);
    out.push(r); dataIdx.push(i);
  }
  // Kiểm tra số liệu, đọc lại các ô số nghi ngờ
  const total = out.length;
  for (let k = 0; k < out.length; k++){
    const r = out[k], b = bands[r._band];
    progress(0.66 + 0.2 * (k / Math.max(1, total)), `Đang kiểm tra dòng ${k + 1}/${total}…`);
    const nums = {};
    ['tl1','tl2','tlh','bi','thuc'].forEach(f => nums[f] = numOf(r[f]));
    let rc = reconcile(nums);
    if (!rc.ok && !late()){
      for (const f of ['thuc','tlh','bi','tl1','tl2']){
        const c = r._cells[f]; if (!c) continue;
        const crop = cropCanvas(ctx.clean, c.x0 + 2, b.y0 + 2, c.x1 - 2, b.y1 - 2, 2);
        const o = await ocr(crop, { psm: '7', whitelist: '0123456789,.' });
        const v = numOf(o.text); if (v != null) nums[f] = v;
      }
      rc = reconcile(nums);
    }
    ['tl1','tl2','tlh','bi','thuc'].forEach(f => { if (rc.vals[f] != null) r[f] = fmtKg(rc.vals[f]); });
    if (rc.ok) r.flags.thucOk = true;
    else if (!(nums.thuc != null && map.tlh == null && map.bi == null)) r.flags.thuc = true;   // phiếu không có cột để đối chiếu: không tô vàng
    { const a = parseKg(r.tl1), b2 = parseKg(r.tl2), h = parseKg(r.tlh);
      if (a != null && b2 != null && h != null && Math.abs(b2 - a) !== h){ r.flags.tl1 = r.flags.tl2 = true; } }
    if (!r.khach) r.flags.khach = true;
    // giờ cân bị chữ viết tay đè -> đọc lại riêng phần trên của ô
    if (!reTime.test(r.gio) && r._cells.gio && !late()){
      const c = r._cells.gio, crop = cropCanvas(ctx.clean, c.x0 + 2, b.y0 + 2, c.x1 - 2, b.y0 + (b.y1 - b.y0) * 0.62, 1.5);
      const o = await ocr(crop, { psm: '7', whitelist: '0123456789:' });
      const tm = o.text.match(/(\d{1,2}):?(\d{2}):?(\d{2})/);
      r.gio = tm ? [tm[1].padStart(2, '0'), tm[2], tm[3]].join(':') : r.gio;
    }
    // chữ viết tay dưới giờ cân (bỏ qua khi phiếu đã in sẵn Xanh/Nổi/Chín)
    const gc = r._printed ? null : r._cells.gio;
    if (r._printed){
      // thiếu số hoặc Xanh + Nổi + Chín ≠ 100: đọc lại riêng từng ô (chỉ chữ số)
      let pc = pcts(r);
      if ((pc.have < 2 || pc.bad) && !late()){
        const yEnd = r.ghichu ? b.y0 + (b.y1 - b.y0) * 0.5 : b.y1;
        const cand = {};   // mỗi ô: các cách đọc khác nhau
        for (const f of PF){
          cand[f] = r[f] ? [r[f]] : [];
          const ref = map[f] != null && colX[map[f]]; if (!ref) continue;
          for (const [up, bw] of [[2, true], [1, true], [3, false]]){
            if (late() && up !== 2) break;
            const crop = cropCanvas(ctx.clean, ref.x0 + 2, b.y0 + 2, ref.x1 - 2, yEnd - 2, up);
            if (bw) binarize(crop, 150);   // đen trắng hẳn: đọc chữ số in nhỏ chắc hơn
            const o = await ocr(crop, { psm: '7', whitelist: '0123456789.,' });
            const m = o.text.replace(/\s+/g, '').match(/^\d{1,3}(?:[.,]\d{1,2})?$/);
            if (m && +m[0].replace(',', '.') <= 100){ const v = String(+m[0].replace(',', '.')); if (!cand[f].includes(v)) cand[f].push(v); }
          }
        }
        // ưu tiên tổ hợp có tổng đúng 100 (hoặc đủ 2 ô để tự tính ô còn lại)
        const opts = f => cand[f].length ? cand[f] : [''];
        let best = null;
        for (const x of opts('xanh')) for (const n of opts('noi')) for (const c of opts('chin')){
          const t = { xanh: x, noi: n, chin: c }, q = pcts(t);
          const score = (q.have >= 2 && !q.bad ? 10 : 0) + q.have;
          if (!best || score > best.score) best = { t, score };
        }
        if (best) PF.forEach(f => r[f] = best.t[f]);
        pc = pcts(r);
      }
      if (pc.have < 2) PF.forEach(f => { if (!r[f]) r.flags[f] = true; });
      else if (pc.bad) PF.forEach(f => r.flags[f] = true);
    }
    if (gc){
      const tws = wIn(b, gc).filter(w => reTime.test(w.t) || /^\d+$/.test(w.t));
      let tTop, tBot;
      const medH = median(words.map(w => w.h)) || 20 * ctx.scale;
      if (tws.length){ tTop = Math.min(...tws.map(w => w.y0)); tBot = Math.max(...tws.map(w => w.y1)); }
      else { const cy = (b.y0 + b.y1) / 2; tTop = cy - medH / 2; tBot = cy + medH / 2; }
      const nextBand = bands[r._band + 1];
      let yEnd;
      const nr = out[k + 1];
      if (nr && nr._band === r._band + 1){
        const nb = bands[nr._band];
        const nws = wIn(nb, nr._cells.gio || gc).filter(w => reTime.test(w.t));
        yEnd = nws.length ? Math.min(...nws.map(w => w.y0)) - 3 : (nb.y0 + nb.y1) / 2 - medH / 2;
      } else if (nextBand){
        yEnd = nextBand.y1;
      } else yEnd = Math.min(ctx.H - 1, b.y1 + (b.y1 - b.y0));
      const hw = veryLate() ? null : await readHandwriting(ctx, gc.x0 + 2, tBot + 3, gc.x1 - 2, yEnd, tTop);
      applyHW(r, hw);
    }
    delete r._band; delete r._cells; delete r._printed;
  }
  return out;
}
function median(a){ if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; }

// Đối chiếu: TL Thực = TL Hàng − TL Bì ; TL Hàng = TL Lần 2 − TL Lần 1
function reconcile(n){
  const v = Object.assign({}, n);
  const cand = [];
  if (n.thuc != null) cand.push(n.thuc);
  if (n.tlh != null && n.bi != null) cand.push(n.tlh - n.bi);
  if (n.tl1 != null && n.tl2 != null && n.bi != null) cand.push(Math.abs(n.tl2 - n.tl1) - n.bi);
  const votes = {}; cand.forEach(c => votes[c] = (votes[c] || 0) + 1);
  const best = Object.keys(votes).sort((a, b) => votes[b] - votes[a])[0];
  if (best != null && votes[best] >= 2 && +best > 0){
    v.thuc = +best;
    if (n.bi != null){
      const h = v.thuc + n.bi;
      if (n.tlh !== h) v.tlh = h;
    }
    return { ok: true, vals: v };
  }
  if (v.thuc == null && cand.length) v.thuc = cand[0];
  return { ok: false, vals: v };
}

function cropCanvas(c, x0, y0, x1, y1, up = 1){
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
  x1 = Math.min(c.width - 1, Math.ceil(x1)); y1 = Math.min(c.height - 1, Math.ceil(y1));
  const w = Math.max(1, x1 - x0 + 1), h = Math.max(1, y1 - y0 + 1), pad = 12;
  const o = mkCanvas(w * up + pad * 2, h * up + pad * 2), g = o.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, o.width, o.height);
  g.imageSmoothingQuality = 'high';
  g.drawImage(c, x0, y0, w, h, pad, pad, w * up, h * up);
  return o;
}

function binarize(c, th){
  const g = c.getContext('2d'), im = g.getImageData(0, 0, c.width, c.height), d = im.data;
  for (let p = 0; p < d.length; p += 4){ const v = (d[p] * 299 + d[p + 1] * 587 + d[p + 2] * 114) / 1000 < th ? 0 : 255; d[p] = d[p + 1] = d[p + 2] = v; }
  g.putImageData(im, 0, 0); return c;
}
// Đọc chữ viết tay trong vùng (dưới giờ cân)
async function readHandwriting(ctx, x0, y0, x1, y1, tTop){
  const { W, H, gray, ink, isLine, src } = ctx;
  x0 = Math.max(0, Math.floor(x0)); x1 = Math.min(W - 1, Math.ceil(x1));
  y0 = Math.max(0, Math.floor(y0)); y1 = Math.min(H - 1, Math.ceil(y1));
  if (x1 - x0 < 8 || y1 - y0 < 6) return null;
  // ưu tiên nét bút màu; nếu không có thì lấy nét tối (bút đen) đã bỏ đường kẻ
  let inkCnt = 0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) inkCnt += ink[y * W + x];
  const useInk = inkCnt > 30 * ctx.scale;
  const fg = (i) => useInk ? ink[i] : (!isLine[i] && gray[i] < 140);
  let bx0 = 1e9, by0 = 1e9, bx1 = -1, by1 = -1, cnt = 0;
  // chiếu theo hàng để bỏ vệt rời rạc
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++){
    if (fg(y * W + x)){ cnt++; if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; if (y > by1) by1 = y; }
  }
  if (cnt < 25 * ctx.scale || bx1 - bx0 < 6 * ctx.scale) return null;
  // nếu nét bút màu kéo dài lên trên (đè giờ cân) thì mở rộng vùng lên trên
  if (useInk && by0 <= y0 + 1){
    for (let y = y0 - 1; y >= Math.max(0, tTop); y--){
      let any = false; for (let x = x0; x <= x1; x++) if (ink[y * W + x]){ any = true; if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; }
      if (!any) break; by0 = y;
    }
  }
  const pad = Math.round(4 * ctx.scale);
  bx0 = Math.max(0, bx0 - pad); by0 = Math.max(0, by0 - pad); bx1 = Math.min(W - 1, bx1 + pad); by1 = Math.min(H - 1, by1 + pad);
  const w = bx1 - bx0 + 1, h = by1 - by0 + 1;
  // ảnh nhị phân cho OCR
  const up = Math.max(1, Math.min(4, 70 / h));
  const bin = mkCanvas(w * up + 40, h * up + 40), bg = bin.getContext('2d');
  const tmp = mkCanvas(w, h), tg = tmp.getContext('2d'), ti = tg.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const i = (by0 + y) * W + (bx0 + x), on = fg(i) ? 0 : 255, p = (y * w + x) * 4;
    ti.data[p] = ti.data[p + 1] = ti.data[p + 2] = on; ti.data[p + 3] = 255;
  }
  tg.putImageData(ti, 0, 0);
  bg.fillStyle = '#fff'; bg.fillRect(0, 0, bin.width, bin.height);
  bg.imageSmoothingQuality = 'high';
  bg.drawImage(tmp, 20, 20, w * up, h * up);
  // ảnh màu để người dùng xem lại
  const view = mkCanvas(w, h); view.getContext('2d').drawImage(src, bx0, by0, w, h, 0, 0, w, h);
  const vs = Math.min(1, 90 / h);
  const v2 = mkCanvas(w * vs, h * vs); v2.getContext('2d').drawImage(view, 0, 0, v2.width, v2.height);
  const crop = v2.toDataURL('image/png');
  let o = await ocr(bin, { psm: '7', whitelist: '0123456789XxNnCc-., ' });
  let p = parseXN(o.text);
  if ((!p || p.weak) && !late()){ const o2 = await ocr(bin, { psm: '6', whitelist: '0123456789XxNnCc-., ' }); const p2 = parseXN(o2.text); if (p2 && (!p || !p2.weak)){ o = o2; p = p2; } }
  const cw = o.words.filter(w => /\d/.test(w.t));
  const conf = cw.length ? Math.min(...cw.map(w => w.conf)) : 0;
  return { crop, text: o.text.trim(), parsed: p, conf };
}
// "17X - 20N", "17X-78C", "20N 63C 17X"... : số + chữ X (xanh) / N (nổi) / C (chín)
function parseXN(t){
  const s = String(t || '').replace(/\s+/g, ' ').replace(/(\d)\s*[.,]\s*(\d)/g, '$1.$2').trim();
  const fix = v => { let f = +v; if (f > 100 && /^\d{3}$/.test(v)) f = +(v.slice(0, 2) + '.' + v.slice(2)); return f; };
  const key = { x: 'x', k: 'x', '×': 'x', n: 'n', h: 'n', m: 'n', c: 'c', g: 'c', '(': 'c' };
  const re = /(\d{1,3}(?:\.\d+)?) ?([xk×nhmcg(])/gi;
  const out = { x: null, n: null, c: null, weak: false };
  let m, found = 0;
  while ((m = re.exec(s))){ const k = key[m[2].toLowerCase()]; if (out[k] == null){ out[k] = fix(m[1]); found++; } }
  if (found >= 2) return out;
  // số không kèm chữ: xếp lần lượt vào Xanh, Nổi, Chín còn trống
  const free = s.replace(re, ' ').match(/\d+(?:\.\d+)?/g) || [];
  if (!found && !free.length) return null;
  ['x','n','c'].forEach(k => { if (out[k] == null && free.length) out[k] = fix(free.shift()); });
  out.weak = true;
  return out;
}
function applyHW(r, hw){
  if (!hw){ PF.forEach(f => r.flags[f] = true); return; }
  r.crop = hw.crop; r.hwText = hw.text;
  const p = hw.parsed;
  const unsure = !p || p.weak || hw.conf < 80;   // độ tin cậy thấp -> viền vàng để người dùng xem lại
  let got = 0;
  [['xanh','x'],['noi','n'],['chin','c']].forEach(([f, k]) => {
    if (p && p[k] != null && p[k] <= 100){ r[f] = fmtPctIn(p[k]); got++; if (unsure) r.flags[f] = true; }
  });
  if (got < 2) PF.forEach(f => { if (!r[f]) r.flags[f] = true; });   // chưa đủ 2 trong 3
}

// Dự phòng khi không có lưới: dùng giờ cân làm mốc từng dòng
async function parseLoose(words, ctx){
  const times = words.filter(w => /^\d{1,2}[:.;]\d{2}([:.;]\d{2})?$/.test(w.t)).sort((a, b) => a.cy - b.cy);
  if (!times.length) return [];
  const medH = median(words.map(w => w.h)) || 20;
  const hdr = words.find(w => /kh.?ch/.test(norm(w.t)));
  const thucH = words.find(w => /th.?c/.test(norm(w.t)) && w !== hdr);
  const dates = words.filter(w => reDate.test(w.t)).map(w => ({ y: w.cy, d: fixDate(w.t.match(reDate)) }));
  const out = [];
  for (let k = 0; k < Math.min(times.length, 60); k++){
    const t = times[k], same = words.filter(w => Math.abs(w.cy - t.cy) < medH * 0.9);
    const nums = same.filter(w => w.x1 < t.x0 && /^[\d.,]+$/.test(cleanNum(w.t)) && /\d/.test(w.t)).sort((a, b) => a.x0 - b.x0);
    const big = nums.filter(w => numOf(w.t) != null);
    const vals = big.map(w => numOf(w.t));
    const n = { thuc: vals[vals.length - 1] ?? null, bi: vals[vals.length - 2] ?? null, tlh: vals[vals.length - 3] ?? null, tl2: vals[vals.length - 4] ?? null, tl1: vals[vals.length - 5] ?? null };
    const rc = reconcile(n);
    let khach = '';
    if (hdr){
      const firstNum = big.length >= 5 ? big[big.length - 5] : big[0];
      khach = joinWords(words.filter(w => Math.abs(w.cy - t.cy) < medH * 1.6 && w.cx > hdr.x0 - medH * 4 && (!firstNum || w.x1 < firstNum.x0) && !/^[\d.,:]+$/.test(w.t)));
    }
    const dd = dates.filter(x => x.y < t.cy).pop();
    const r = { date: dd ? dd.d : '', stt: '', soxe: '', hang: '', khach: cleanText(khach), gio: t.t.replace(/[.;]/g, ':'), flags: { khach: true } };
    ['tl1','tl2','tlh','bi','thuc'].forEach(f => r[f] = rc.vals[f] != null ? fmtKg(rc.vals[f]) : '');
    if (rc.ok) r.flags.thucOk = true; else r.flags.thuc = true;
    const next = times[k + 1];
    const hw = veryLate() ? null : await readHandwriting(ctx, t.x0 - medH * 2, t.y1 + 3, t.x1 + medH * 3, next ? next.y0 - 3 : t.y1 + medH * 3, t.y0);
    applyHW(r, hw);
    out.push(r);
  }
  void thucH;
  return out;
}

/* =========================================================================
   Gemini (tuỳ chọn) — đọc chữ viết tay chính xác hơn
   ========================================================================= */
function blobToB64(blob){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); }); }
async function geminiRead(blob, key, model){
  const b64 = await blobToB64(blob);
  const prompt = `Ảnh là phiếu cân xe cà phê (bảng in, có thể nhiều "Ngày cân"). Mỗi dòng xe có số viết tay bằng bút ngay phía dưới ô "Giờ cân" gồm 2 hoặc 3 số kèm chữ: X = % xanh, N = % nổi, C = % chín (ví dụ "17X - 20N" nghĩa là xanh 17, nổi 20; "17X - 63C" nghĩa là xanh 17, chín 63).
Nếu bảng đã có sẵn các cột "Xanh (%)", "Nổi (%)", "Chín (%)" in sẵn thì lấy số trong các cột đó (dấu "–" nghĩa là trống); dòng chữ nghiêng nằm ngay dưới 3 cột này là ghi chú của dòng xe đó. Ngày cân có thể nằm ở dòng "Ngày cân : …" hoặc ngay dưới giờ cân trong cùng ô.
Hãy trích xuất MỌI dòng xe (bỏ qua dòng "Tổng cộng"/"TỔNG CỘNG TẤT CẢ" và các ô tổng kết bên dưới bảng), theo đúng thứ tự từ trên xuống. Trả về JSON:
{"rows":[{"ngay":"dd/mm/yyyy","stt":"","so_xe":"","hang_hoa":"","khach_hang":"","tl_lan1":0,"tl_lan2":0,"tl_hang":0,"tl_bi":0,"tl_thuc":0,"gio_can":"hh:mm:ss","xanh":null,"noi":null,"chin":null,"ghi_chu":""}]}
Khối lượng là số nguyên kg (dấu phẩy trong ảnh là dấu phân cách hàng nghìn, ví dụ 41,926 = 41926). xanh/noi/chin là số (có thể có phần thập phân), null nếu không ghi. Giữ nguyên dấu tiếng Việt của tên khách hàng.`;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), LIM.gemini);
  if (job) job.ctl.signal.addEventListener('abort', () => ctl.abort(), { once: true });
  const r = await fetch(url, {
    method: 'POST', signal: ctl.signal,
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({
      contents: [{ parts: [{ inline_data: { mime_type: blob.type || 'image/png', data: b64 } }, { text: prompt }] }],
      generationConfig: { responseMimeType: 'application/json', temperature: 0 }
    })
  }).catch(e => { throw new Error(job && job.cancelled ? 'Đã huỷ' : e.name === 'AbortError' ? 'phản hồi quá lâu' : 'không kết nối được tới Google'); })
    .finally(() => clearTimeout(to));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  const txt = (((j.candidates || [])[0] || {}).content || {}).parts?.map(p => p.text || '').join('') || '';
  const m = txt.match(/\{[\s\S]*\}/);
  const data = JSON.parse(m ? m[0] : txt);
  return (data.rows || []).map(x => ({
    date: x.ngay || '', stt: String(x.stt ?? ''), soxe: x.so_xe || '', hang: x.hang_hoa || '', khach: x.khach_hang || '',
    tl1: num(x.tl_lan1), tl2: num(x.tl_lan2), tlh: num(x.tl_hang), bi: num(x.tl_bi), thuc: num(x.tl_thuc), gio: x.gio_can || '',
    xanh: x.xanh == null || x.xanh === '' ? null : +String(x.xanh).replace(',', '.'), ghichu: x.ghi_chu || '', noi: x.noi == null || x.noi === '' ? null : +String(x.noi).replace(',', '.'), chin: x.chin == null || x.chin === '' ? null : +String(x.chin).replace(',', '.')
  }));
  function num(v){ if (v == null || v === '') return null; return typeof v === 'number' ? v : parseKg(String(v)); }
}
function mergeGemini(local, gem){
  const toRow = g => {
    const n = { tl1: g.tl1, tl2: g.tl2, tlh: g.tlh, bi: g.bi, thuc: g.thuc }, rc = reconcile(n);
    const r = { date: g.date, stt: g.stt, soxe: g.soxe, hang: g.hang, khach: g.khach, gio: g.gio, flags: {} };
    ['tl1','tl2','tlh','bi','thuc'].forEach(f => r[f] = rc.vals[f] != null ? fmtKg(rc.vals[f]) : '');
    if (rc.ok) r.flags.thucOk = true; else r.flags.thuc = true;
    PF.forEach(f => r[f] = g[f] != null && !isNaN(g[f]) ? fmtPctIn(g[f]) : '');
    r.ghichu = g.ghichu || '';
    if (PF.filter(f => r[f]).length < 2) PF.forEach(f => { if (!r[f]) r.flags[f] = true; });
    return r;
  };
  if (!gem.length) return local;
  if (local.length !== gem.length) return gem.map(toRow);   // số dòng lệch: tin Gemini
  return local.map((L, i) => {
    const G = toRow(gem[i]), r = Object.assign({}, L, { flags: Object.assign({}, L.flags) });
    // chữ viết tay: ưu tiên Gemini; nếu hai bên khác nhau thì đánh dấu để kiểm tra
    PF.forEach(f => {
      if (G[f] !== ''){
        const same = L[f] !== '' && Math.abs(parsePct(L[f]) - parsePct(G[f])) < 0.01;
        r[f] = G[f];
        if (same) delete r.flags[f]; else r.flags[f] = L[f] !== '';   // khác nhau => vàng
        if (L[f] === '') delete r.flags[f];
      }
    });
    if (PF.filter(f => r[f]).length >= 2) PF.forEach(f => { if (!r[f]) delete r.flags[f]; });
    if (G.khach && (!L.khach || L.flags.khach)){ r.khach = G.khach; delete r.flags.khach; }
    else if (G.khach && norm(G.khach) === norm(L.khach)) r.khach = G.khach;   // lấy bản có dấu chuẩn
    if (!L.date && G.date) r.date = G.date;
    if (L.flags.thuc && G.flags.thucOk){ ['tl1','tl2','tlh','bi','thuc'].forEach(f => r[f] = G[f]); delete r.flags.thuc; r.flags.thucOk = true; }
    ['soxe','hang','gio','stt','ghichu'].forEach(f => { if (!r[f] && G[f]) r[f] = G[f]; });
    return r;
  });
}

// Trạng thái Gemini: chấm màu trên nút ⚙️ (xanh = đang dùng key, đỏ = key lỗi, vàng = chưa kiểm tra)
function refreshAiTag(){
  const on = !!LS.get('tbxn_gkey', ''), st = LS.get('tbxn_gok', null);
  const b = $('#setBtn');
  if (!on){ b.removeAttribute('data-ai'); b.title = 'Cài đặt nhận dạng — đang đọc trên máy'; return; }
  b.dataset.ai = st === true ? 'ok' : st === false ? 'err' : 'unk';
  b.title = st === true ? 'Đang dùng Gemini (' + (LS.get('tbxn_gmodel', '') || 'gemini-3.8-flash') + ')' : st === false ? 'Key Gemini đang lỗi — bấm để kiểm tra' : 'Đã lưu key Gemini (chưa kiểm tra)';
}
function setStat(cls, html){ const e = $('#gStat'); e.className = 'gstat ' + cls; e.innerHTML = html; }
function showSavedStat(){
  const key = LS.get('tbxn_gkey', ''), st = LS.get('tbxn_gok', null), m = esc(LS.get('tbxn_gmodel', '') || 'gemini-3.8-flash');
  if (!key) setStat('', '⚪ Chưa có key — đang <b>&nbsp;đọc trên máy</b>');
  else if (st === true) setStat('ok', `🟢 Đang dùng Gemini · ${m}`);
  else if (st === false) setStat('err', '🔴 Key đã lưu nhưng đang lỗi — bấm “Kiểm tra”');
  else setStat('', `🟡 Đã lưu key · ${m} — chưa kiểm tra`);
}
// Kiểm tra key: hỏi thông tin model (không tốn lượt đọc ảnh)
async function testKey(key, model){
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}`, { headers: { 'x-goog-api-key': key }, signal: ctl.signal });
    const j = await r.json().catch(() => ({}));
    if (r.ok) return { ok: true, name: j.displayName || model };
    const msg = (j.error && j.error.message) || '';
    if (r.status === 404) return { ok: false, msg: `Không tìm thấy model “${model}”. Hãy chọn model khác.` };
    if (/API key not valid|API_KEY_INVALID/i.test(msg) || r.status === 400) return { ok: false, msg: 'Key không hợp lệ — kiểm tra lại đã sao chép đủ chưa.' };
    if (r.status === 403) return { ok: false, msg: 'Key bị từ chối (chưa bật Gemini API hoặc bị giới hạn).' };
    if (r.status === 429) return { ok: false, msg: 'Đã hết lượt miễn phí tạm thời — thử lại sau.' };
    return { ok: false, msg: msg || ('Lỗi HTTP ' + r.status) };
  } catch(e){
    return { ok: false, net: true, msg: e.name === 'AbortError' ? 'Quá thời gian chờ — kiểm tra mạng.' : 'Không kết nối được tới Google — kiểm tra mạng.' };
  } finally { clearTimeout(to); }
}
async function runTest(){
  const key = $('#gKey').value.trim(), model = $('#gModel').value.trim() || 'gemini-3.8-flash';
  if (!key){ setStat('', '⚪ Chưa nhập key — trang sẽ đọc trên máy'); return null; }
  setStat('wait', '⏳ Đang kiểm tra key với Google…');
  $('#gTest').disabled = $('#setSave').disabled = true;
  const r = await testKey(key, model);
  $('#gTest').disabled = $('#setSave').disabled = false;
  if (r.ok) setStat('ok', `✅ Key hoạt động · ${esc(r.name)}`);
  else setStat('err', '❌ ' + esc(r.msg));
  return r;
}
$('#setBtn').addEventListener('click', () => {
  $('#gKey').value = LS.get('tbxn_gkey', ''); $('#gModel').value = LS.get('tbxn_gmodel', '') || 'gemini-3.8-flash';
  $('#setSave').textContent = 'Lưu'; $('#setSave').dataset.force = '';
  showSavedStat();
  $('#setDlg').showModal();
});
['gKey','gModel'].forEach(id => $('#' + id).addEventListener('input', () => { $('#setSave').textContent = 'Lưu'; $('#setSave').dataset.force = ''; }));
$('#gTest').addEventListener('click', runTest);
$('#setSave').addEventListener('click', async () => {
  const key = $('#gKey').value.trim(), model = $('#gModel').value.trim();
  const commit = ok => {
    LS.set('tbxn_gkey', key); LS.set('tbxn_gmodel', model); LS.set('tbxn_gok', key ? ok : null);
    refreshAiTag(); $('#setDlg').close();
  };
  if (!key){ commit(null); toast('Đã lưu — đọc ảnh trên máy'); return; }
  if ($('#setSave').dataset.force){ commit(null); toast('Đã lưu key (chưa kiểm tra được)'); return; }
  const r = await runTest();
  if (r && r.ok){ commit(true); toast('✅ Đã lưu — đang dùng Gemini'); return; }
  // lỗi: giữ hộp thoại mở để sửa; nếu do mạng thì cho phép vẫn lưu
  if (r && r.net){ $('#setSave').textContent = 'Vẫn lưu'; $('#setSave').dataset.force = '1'; }
});
(function(){
  const t = LS.get('tbxn_theme', null);
  if (t) document.documentElement.dataset.theme = t;
  $('#themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme;
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const n = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = n; LS.set('tbxn_theme', n);
  });
})();

fillSortOpts();
renderTable();
